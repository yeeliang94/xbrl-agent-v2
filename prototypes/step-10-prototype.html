<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports and workbook prototype</title>
<style>
:root{
  /* neutrals and orange taken from the current app's tokens (web/src/lib/theme.ts) */
  --bg:#EEEFF1; --panel:#FFFFFF; --tint:#F5F7F8; --line:#DFE3E6; --edge:#CBD1D6; --ink:#111111; --muted:#6B7280; --faint:#B5BCC4;
  --nav:#000000; --nav-ink:#FFFFFF; --nav-muted:#9AA1A9; --nav-on:#1F1F1F;
  --accent:#FD5108; --accent-text:#D64000; --accent-soft:#FFF5ED; --accent-mid:#FFE8D4;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/20px -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-width:1280px}
h1,h2,h3,p{margin:0}
h1{font-weight:500;font-size:22px;line-height:28px;letter-spacing:-.015em}
h2{font-weight:500;font-size:16px;line-height:24px;letter-spacing:-.005em}
h3{font-weight:500;font-size:14px;line-height:20px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.app{height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr)}

/* sidebar */
.nav{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;padding:16px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;margin-bottom:16px;font-weight:500}
.brand i{width:14px;height:14px;border-radius:3px;background:var(--accent);display:block}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;height:32px;padding:0 12px;border-radius:8px;cursor:pointer;color:var(--nav-muted);transition:background .15s,color .15s}
.nav a:hover{color:var(--nav-ink)}
.nav a.on{background:var(--nav-on);color:var(--nav-ink)}
.nav a.sub{padding-left:24px}
.nav a span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .grp{color:#6B7280;font-size:12px;padding:24px 12px 4px}
.nav .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;padding:8px 12px;color:var(--nav-muted)}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--nav-on);color:var(--nav-ink);display:grid;place-items:center;font-size:11px}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bg);color:var(--ink);font:400 12px/20px var(--mono);text-align:center;flex:none}
.nav .cnt{background:none;color:#FE7C39;padding:0;min-width:0}
.spin{width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;border-top-color:transparent;display:inline-block;flex:none;animation:rot .8s linear infinite;color:var(--accent)}
.nav .spin{color:#FE7C39}
@keyframes rot{to{transform:rotate(360deg)}}

/* main */
main{min-width:0;min-height:0;display:flex;flex-direction:column;padding:0 24px 24px}
.ph{display:flex;align-items:center;gap:12px;height:80px;flex:none}
.ph .sp{flex:1}
.meta{color:var(--muted)}
.panel{background:var(--panel);border-radius:12px;min-height:0}
.pad{padding:24px}
.narrow{width:100%;max-width:880px;display:flex;flex-direction:column;gap:16px;overflow:auto;padding-bottom:64px}
.narrow>*{flex:none}

/* buttons */
.btn{height:36px;padding:0 16px;border-radius:999px;border:1px solid transparent;background:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .12s var(--ease),background .15s,border-color .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2B2B2B}
.btn.outline{border-color:var(--edge)}
.btn.outline:hover{background:var(--tint)}
.btn.quiet{padding:0 8px;color:var(--muted)}
.btn.quiet:hover{color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.sm{height:28px;padding:0 12px;font-size:13px}
.icon{width:28px;height:28px;border-radius:8px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.icon:hover,.icon.on{background:var(--bg);color:var(--ink)}
.icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon b,.icon i,.icon u{font:500 14px/1 Georgia,serif}

/* pills, segments, inputs */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;font-size:13px;white-space:nowrap;color:var(--ink)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--faint);flex:none}
.pill.green::before{background:var(--ink);box-shadow:none}
.pill.amber::before{background:var(--accent);box-shadow:none}
.pill.red{background:var(--accent-text);color:#fff;padding:0 8px;border-radius:999px;font-size:12px}
.pill.red::before,.pill:has(.spin)::before{display:none}
.pill .spin{width:10px;height:10px}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:4px}
.seg button{height:28px;padding:0 12px;border:0;border-radius:999px;background:none;cursor:pointer;color:var(--muted);transition:background .15s,color .15s}
.seg button.on{background:#fff;color:var(--ink)}
.in,select.in,textarea.in{width:100%;height:36px;padding:0 12px;border:0;border-radius:12px;background:var(--bg);outline:none;transition:box-shadow .15s}
textarea.in{height:72px;padding:8px 12px;resize:none;line-height:20px;display:block}
.in:focus{box-shadow:0 0 0 2px var(--ink)}
.switch{width:36px;height:20px;border-radius:999px;border:0;background:var(--edge);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s var(--ease)}
.switch.on{background:var(--ink)}
.switch.on::after{transform:translateX(16px)}

/* tables */
table{border-collapse:collapse;width:100%}
.tbl th{font-weight:400;color:var(--muted);text-align:left;height:36px;padding:0 12px;border-bottom:1px solid var(--line)}
.tbl td{height:48px;padding:0 12px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--tint)}
.tbl.flat tbody tr{cursor:default}
.tbl.flat tbody tr:hover td{background:none}
.r{text-align:right}

/* run layout */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px}
.work,.side{display:flex;flex-direction:column;overflow:hidden}
.wh{flex:none;height:64px;display:flex;align-items:center;gap:12px;padding:0 24px}
.wh .sp{flex:1}
.wh>*{flex:none}
.wh h2{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{flex:1;min-height:0;overflow:auto;padding:0 24px 24px}

/* grid */
.grid{table-layout:fixed}
.grid th{position:sticky;top:0;background:#fff;font-weight:400;color:var(--muted);height:32px;padding:0 12px;z-index:1;text-align:left}
.grid th.n{text-align:right}
.grid td{height:36px;padding:0 12px;border-bottom:1px solid var(--line);transition:background .15s}
.grid td.lab{cursor:pointer;padding-top:8px;padding-bottom:8px}
.grid .l2{color:var(--muted);font-size:13px;line-height:18px}
.grid tr.hd td{font-weight:500;font-size:13px;background:var(--tint);border-bottom:0;height:32px}
.grid tr.hd td:first-child{border-radius:8px 0 0 8px}
.grid tr.hd td:last-child{border-radius:0 8px 8px 0}
.grid tr.gap td{height:12px;border:0;padding:0}
.grid tr.tot td{font-weight:500;border-bottom-color:transparent}
.grid tr.tot td.v{box-shadow:inset 0 1px 0 var(--ink)}
.grid tr.emp td{color:var(--faint)}
.grid td.v{text-align:right;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer;position:relative}
.grid tr:not(.hd):hover td{background:var(--tint)}
.grid tr.rsel td{background:var(--accent-soft)}
.grid td.v.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.grid td.v.mk::after{content:"";position:absolute;top:4px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.grid td.lab.mk>div:first-child::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
.grid td.st{text-align:right;padding-right:0}
.grid tr.sk .val{display:inline-block;width:72px;height:8px;border-radius:4px;font-size:0;color:transparent;vertical-align:middle;background:linear-gradient(90deg,#E6E9EC 25%,#F5F7F8 50%,#E6E9EC 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}
.grid tr.sk .l2 .val{width:140px}
.grid tr.sk td.st *{display:none}
.grid tr.pop .val{animation:pop .4s var(--ease)}
.grid td.v.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes shim{to{background-position:-200% 0}}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{background:var(--accent-soft)}}
.empty{color:var(--muted);padding:48px 0;text-align:center}

/* side */
.tabs{flex:none;height:64px;display:flex;align-items:center;gap:24px;padding:0 24px}
.tabs a{cursor:pointer;color:var(--muted);height:64px;display:flex;align-items:center;gap:8px;transition:color .15s}
.tabs a.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.sb{flex:1;min-height:0;overflow:auto;padding:16px 24px 24px;display:flex;flex-direction:column;gap:16px}
.frow{display:grid;grid-template-columns:88px 1fr;align-items:center;gap:12px;min-height:36px}
.frow>span:first-child{color:var(--muted)}
.det{display:flex;flex-direction:column;gap:12px}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.why{color:var(--muted)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);background:none;cursor:pointer;font-size:13px;transition:background .15s}
.chip:hover{background:var(--tint)}
.pgwrap{background:var(--bg);border-radius:12px;padding:16px}
.pgh{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding-bottom:12px}
.page{background:#fff;padding:24px 20px;font:400 11.5px/17px Georgia,"Times New Roman",serif;color:#222}
.page .co{text-align:center;font-weight:700}
.page .ti{text-align:center;margin-bottom:12px}
.page table td{padding:1px 0 1px 8px}
.page table td:first-child{padding-left:0}
.page td.n{text-align:right;width:84px;font-variant-numeric:tabular-nums}
.page tr.h td{font-weight:700;padding-top:8px}
.page tr.t td.n{border-top:1px solid #222}
.page tr.hl td{background:var(--accent-mid)}
.cm{background:var(--tint);border-radius:12px;padding:12px 12px 12px 16px;display:flex;flex-direction:column;gap:8px;animation:pop .3s var(--ease)}
.cm .loc{font-weight:500;cursor:pointer}
.cm s{color:var(--muted)}

/* activity */
.feed{display:flex;flex-direction:column;gap:12px}
.fl{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;color:var(--muted)}
.fl.enter{animation:pop .35s var(--ease)}
.fl .dot{width:6px;height:6px;border-radius:50%;background:var(--edge);justify-self:center}
.fl.act{color:var(--ink)}
.fl.act .tx{background:linear-gradient(90deg,var(--ink) 0%,var(--ink) 35%,#B5BCC4 50%,var(--ink) 65%,var(--ink) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 1.6s linear infinite}
@keyframes sweep{from{background-position:120% 0}to{background-position:-100% 0}}
.fl .ct{color:var(--muted)}

/* notes */
.tb{flex:none;display:flex;align-items:center;gap:4px;padding:0 24px 12px}
.tb .div{width:1px;height:20px;background:var(--line);margin:0 8px}
.tb .sp{flex:1}
.stage{flex:1;min-height:0;overflow:auto;background:var(--bg);margin:0 24px 24px;border-radius:12px;padding:24px}
.a4{background:#fff;max-width:660px;margin:0 auto;padding:40px 44px;font:400 13px/19px Arial,Helvetica,sans-serif;color:#000;min-height:560px}
.a4 .nh{font-weight:700;margin-bottom:10px;cursor:pointer}
.a4 p{margin-bottom:10px;text-align:justify;cursor:pointer}
.a4 table{margin-bottom:12px}
.a4 td{padding:2px 4px;cursor:pointer;vertical-align:bottom;transition:background .15s}
.a4 .hit{background:var(--accent-soft)}
.a4 .has{position:relative}
.a4 .has::before{content:"";position:absolute;left:-16px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.a4 .skl{height:10px;border-radius:5px;margin-bottom:14px;background:linear-gradient(90deg,#E6E9EC 25%,#F5F7F8 50%,#E6E9EC 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}

/* setup, settings */
.sec{display:flex;flex-direction:column;gap:16px}
.line{display:flex;align-items:center;gap:16px;min-height:36px}
.line>span:first-child{flex:1}
.line .ctl{width:240px;flex:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
.fld2{display:flex;flex-direction:column;gap:8px}
.fld2>span{color:var(--muted)}
.drop{border:1.5px dashed var(--edge);border-radius:12px;height:240px;display:grid;place-items:center;text-align:center}
.drop div{display:flex;flex-direction:column;gap:16px;align-items:center}
.gl{display:flex;align-items:center;gap:12px;min-height:36px;padding:0 4px 0 12px;background:var(--tint);border-radius:12px}
.gl span{flex:1}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,20,19,.36);display:grid;place-items:center;z-index:20;animation:fade .2s}
.dlg{width:520px;background:#fff;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px;animation:pop .3s var(--ease)}
@keyframes fade{from{opacity:0}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{background:var(--tint);border-radius:12px;padding:16px}
.stat b{display:block;font-weight:500;font-size:24px;line-height:32px;font-family:var(--mono)}
.stat span{color:var(--muted)}

/* prototype bar */
.proto{position:fixed;left:calc(50% + 116px);bottom:16px;transform:translateX(-50%);background:#000000;color:#fff;border-radius:999px;height:44px;padding:0 8px 0 16px;display:flex;align-items:center;gap:4px;z-index:30;font-size:13px}
.proto span{color:#9AA1A9;margin-right:8px}
.proto button{white-space:nowrap;height:28px;padding:0 12px;border-radius:999px;border:0;background:none;color:#fff;cursor:pointer}
.proto button:hover{background:#1F1F1F}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fl.act .tx{color:var(--ink);background:none}}
</style>
<style>
.why{color:var(--muted);font-size:13px}
.line.pick{cursor:pointer;border-radius:12px;margin:0 -12px;padding:0 12px;transition:background .15s}
.line.pick:hover{background:var(--tint)}
.line.pick.sel{background:var(--accent-soft)}
.pg{color:var(--muted);width:48px;flex:none;font-family:var(--mono);font-size:13px}
.unsure{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:8px;vertical-align:middle}
.setup{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:16px}
.setup .form{overflow:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:64px}
.setup .form>*{flex:none}
.scan{background:#fff;aspect-ratio:1/1.414;border-radius:4px;padding:28px 24px;font:400 10.5px/15px Arial,sans-serif;color:#222;filter:grayscale(1) contrast(.95)}
.scan .t{font-weight:700}
.scan table td{padding:1px 0}
.scan td.n{text-align:right;width:70px}
.prog{height:4px;border-radius:2px;background:var(--bg);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
</style>
<style>
.line h2{flex:1}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 16px}
.kv span:nth-child(odd){color:var(--muted)}
.ftbl td{height:44px}
.ftbl td.val{max-width:320px}
.ftbl tr.none td.val{color:var(--faint)}
.ftbl tr.sel td{background:var(--accent-soft)}
</style>
</head><body><div id="root"></div>
<script>
const st = {view:'setup', wb:'none', report:'DR', field:null, modal:null, sel:null};
const esc = s => String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const sel = (o,v) => `<select class="in">${o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
const CO = 'Kemuncak Logistik Sdn. Bhd.';
const YN = ['Yes','No'];
const N5 = ['1','2','3','4','5'];
const PR = ['Primarily responsible for financial management of the company','Not primarily responsible for financial management of the company'];
// [label, kind, value, page, choices, status, reason]  status: filled | not_shown | unsure | not_assessed
const REPORTS = {
 DR:{name:"Directors' report", fields:[
   ["Directors' report text",'html','The directors present their report together with the audited financial statements…','2–7',null,'filled'],
   ['Number of directors signing','choice','2','7',N5,'filled'],
   ['Name of first director who signed','text','Lim Wei Ming','7',null,'filled'],
   ['Type of identification of first director who signed','text','NRIC','33',null,'filled'],
   ['Identification number of the first director who signed','text','780312-14-5521','33',null,'filled'],
   ['Name of second director who signed','text','Siti Aminah binti Yusof','7',null,'filled'],
   ['Type of identification of second director who signed','text',null,'33',null,'unsure','The statutory declaration shows a passport number but not the issuing country.'],
   ['Identification number of the second director who signed','text','HJ2026283','33',null,'filled'],
   ['Name of third director who signed','text',null,'7',null,'not_shown','Only two directors sign the report.'],
   ['Disclosure of status of dividend (final dividend)','choice','Mentioned but not recommended','2',['Recommended','Declared','Paid','Not mentioned','Mentioned but not recommended'],'filled'],
   ['Contingent or other liability enforceable within twelve months','choice','No','6',YN,'filled'],
   ['Substantial, material or unusual items, transactions or events','choice','No','6',YN,'filled'],
   ['Directors received or became entitled to other benefits by contract','choice','No','5',YN,'filled'],
   ["Date of signing directors' report",'date','2025-03-28','7',null,'filled']]},
 SD:{name:'Statement by directors', fields:[
   ['Statement by directors text','html','In the opinion of the directors, the financial statements…','32',null,'filled'],
   ['Financial statements give a true and fair view','choice','Yes','32',YN,'filled'],
   ['Number of directors signing','choice','2','32',N5,'filled'],
   ['Name of first director who signed','text','Lim Wei Ming','32',null,'filled'],
   ['Whether the first director is primarily responsible for financial management','choice',PR[1],'33',PR,'filled'],
   ['Name of second director who signed','text','Siti Aminah binti Yusof','32',null,'filled'],
   ['Whether the second director is primarily responsible for financial management','choice',PR[0],'33',PR,'filled'],
   ['Name of other person primarily responsible for financial management','text',null,'33',null,'not_shown','The statutory declaration is made by the second director.'],
   ['Date of signing statement by directors','date','2025-03-28','32',null,'filled']]},
 AR:{name:"Auditors' report", fields:[
   ["Auditors' report text",'html','We have audited the financial statements of…','34–36',null,'filled'],
   ["Type of auditor's opinion",'choice','Unmodified opinion','34',['Unmodified opinion','Unmodified but emphasis of matter','Modified opinion - Except for','Modified opinion - Disclaimer','Modified opinion - Adverse'],'filled'],
   ["Date of signing auditor's report",'date','2025-03-28','36',null,'filled'],
   ['License number of auditor','text','03272/06/2026 J','36',null,'filled'],
   ['Registration number of audit firm','text','LLP0010081-LCA & AF 0758','34',null,'filled'],
   ['Name of audit firm','text','Ernst & Young PLT','34',null,'filled'],
   ['Address line 1','text','Level 18, Hunza Tower','34',null,'filled'],
   ['Address line 3','text',null,'34',null,'not_shown','The address has two street lines.'],
   ['State','text',null,null,null,'not_assessed']]}
};
const COUNTS = {DR:22, SD:27, AR:13};
const STATUS = {filled:'', not_shown:'Not shown', unsure:'Unsure', not_assessed:'Not read yet'};
function nav(){
  const run = st.view!=='setup';
  const rep = k => `<a class="sub${st.view==='report'&&st.report===k?' on':''}" data-a="rep" data-k="${k}"><span>${REPORTS[k].name}</span>${k==='DR'?'<span class="cnt">1</span>':''}</a>`;
  return `<nav class="nav"><div class="brand"><i></i>XBRL Agent</div><a class="${run?'':'on'}"><span>Runs</span></a><a><span>Settings</span></a>
  ${run?`<div class="grp">Statements</div><a class="sub${st.view==='grid'?' on':''}" data-a="grid"><span>Financial position</span><span class="cnt">1</span></a><a class="sub"><span>Profit or loss</span></a><a class="sub"><span>Comprehensive income</span></a><a class="sub"><span>Changes in equity</span></a><a class="sub"><span>Cash flows</span></a><a class="sub"><span>Checks</span></a><a class="sub"><span>Guidance</span></a><a class="sub"><span>Compare</span></a>
  <div class="grp">Reports</div>${rep('DR')}${rep('SD')}${rep('AR')}<div class="grp">Notes</div><a class="sub"><span>Corporate information</span></a><a class="sub"><span>List of notes</span></a>`:''}
  <span class="sp"></span><div class="who"><span class="avatar">AN</span>Ana</div></nav>`;
}
function wbPanel(){
  if(st.wb==='none') return `<div class="panel pad sec"><div class="line"><h2>Starting workbook</h2><button class="btn outline sm" data-a="wb" data-v="attached">Attach workbook</button></div></div>`;
  if(st.wb==='refused') return `<div class="panel pad sec"><div class="line"><h2>Starting workbook</h2><span class="pill red">Not attached</span><button class="btn outline sm" data-a="wb" data-v="attached">Attach another</button></div>
    <p>This workbook is in RM thousands and this run is in RM, so attach the workbook saved in RM.</p></div>`;
  return `<div class="panel pad sec"><div class="line"><h2>Starting workbook</h2><button class="btn quiet sm" data-a="wb" data-v="none">Remove</button></div>
    <div class="line"><span>Kemuncak_FY2023_mTool.xlsx</span><span class="meta mono">2023 filing</span></div>
    <div class="kv"><span>Last year’s figures, locked</span><span class="mono">412</span><span>This year’s figures a person typed, kept as typed</span><span class="mono">18</span><span>Totals a person typed</span><span class="mono">6</span></div></div>`;
}
function setup(){
  const rows=[['Financial position',13,'Current and non-current'],['Profit or loss',12,'By function'],['Comprehensive income',12,'Net of tax'],['Changes in equity',14,'Changes in equity'],['Cash flows',15,'Indirect']];
  return `<div class="ph"><h1>New run</h1><span class="sp"></span><button class="btn quiet">Cancel</button><button class="btn primary">Start run</button></div>
  <div class="setup"><div class="form">
    <div class="panel pad sec"><h2>Document</h2><div class="line"><span>Doc 3.pdf</span><span class="meta mono">38 pages</span><button class="btn outline sm">Replace</button></div></div>
    <div class="panel pad sec"><h2>Filing</h2><div class="g2">
      <label class="fld2"><span>Company</span><input class="in" value="${esc(CO)}"></label>
      <label class="fld2"><span>Year end</span><input class="in" value="31 December 2024"></label>
      <div class="fld2"><span>Standard</span><div class="seg"><button class="on">MFRS</button><button>MPERS</button></div></div>
      <div class="fld2"><span>Level</span><div class="seg"><button class="on">Company</button><button>Group</button></div></div>
      <div class="fld2"><span>Amounts in</span>${sel(['RM','RM thousands'],'RM')}</div></div></div>
    ${wbPanel()}
    <div class="panel pad sec"><h2>Statements</h2>${rows.map(r=>`<div class="line pick"><span>${r[0]}</span><span class="pg">p${r[1]}</span><div class="ctl">${sel([r[2]],r[2])}</div><button class="switch on"></button></div>`).join('')}
      <div class="line pick"><span>Notes</span><span class="meta">20 notes</span><button class="switch on"></button></div>
</div>
    <div class="panel pad sec"><h2>Guidance for this company</h2><div class="bar"><input class="in" style="flex:1;width:auto" placeholder="Add guidance"><button class="btn outline">Add</button></div></div>
  </div><div class="side" style="overflow:auto"><div class="panel pad sec"><h2>Source</h2><p class="meta">Choose a statement to see the page it was found on and why.</p></div></div></div>`;
}
function runHead(){return `<div class="ph"><h1>${esc(CO)}</h1><span class="sp"></span><button class="btn quiet">Download traces</button><button class="btn primary" data-a="modal" data-v="fill">Prepare mTool file</button></div>`;}
function sideTabs(on){return `<div class="tabs">${['Needs you','Source','Comments','Activity'].map(t=>`<a class="${t===on?'on':''}">${t}${t==='Needs you'?' <span class="cnt">2</span>':''}</a>`).join('')}</div>`;}
function reportView(){
  const r=REPORTS[st.report];
  const shown = v => /^\d{4}-\d\d-\d\d$/.test(v||'') ? new Date(v).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) : v;
  const rows=r.fields.map((f,i)=>`<tr class="${f[2]?'':'none'}${st.field===i?' sel':''}" data-a="field" data-i="${i}"><td>${esc(f[0])}</td><td class="val">${f[2]?(f[1]==='html'?'<span class="meta">'+esc(f[2].slice(0,60))+'</span>':esc(shown(f[2]))):''}${f[5]==='filled'?'':`<span class="pill${f[5]==='unsure'?' amber':''}">${STATUS[f[5]]}</span>`}</td><td class="meta mono r" style="width:72px">${f[3]?'p'+f[3]:''}</td></tr>`).join('');
  const f = st.field==null?null:r.fields[st.field];
  let side;
  if(f==null) side = `<div class="sb"><p class="meta">Choose a field to see its page and change it.</p></div>`;
  else if(f[1]==='html') side = `<div class="sb"><div class="det"><div class="dh"><h3>${esc(f[0])}</h3><span class="meta mono">p${f[3]}</span></div>
     <div class="bar"><button class="btn outline sm" data-a="view" data-v="narr">Open text</button></div></div></div>`;
  else side = `<div class="sb"><div class="det"><div class="dh"><h3>${esc(f[0])}</h3><span class="meta mono">${f[3]?'p'+f[3]:''}</span></div>
     ${f[6]?`<p>${esc(f[6])}</p>`:''}
     ${f[1]==='choice'?sel(['',...f[4]],f[2]||''):f[1]==='date'?`<input class="in" type="date" value="${f[2]||''}">`:`<input class="in" value="${esc(f[2]||'')}">`}
     <div class="bar"><button class="btn outline sm">Save</button><button class="btn quiet sm">Clear</button></div></div>
     ${f[3]?`<div class="pgwrap"><div class="pgh"><span>Page ${f[3]}</span></div><div class="scan"><div class="t">${esc(CO)}</div><br><div class="t">${esc(r.name)}</div><br>${'<div style="height:8px;background:#E6E9EC;border-radius:4px;margin:10px 0"></div>'.repeat(10)}</div></div>`:''}
     <div class="bar"><textarea class="in" placeholder="Comment for the agent"></textarea></div></div>`;
  return runHead()+`<div class="cols"><div class="panel work"><div class="wh"><h2>${esc(r.name)}</h2><span class="sp"></span><span class="meta">${COUNTS[st.report]} fields</span></div>
    <div class="wb"><table class="tbl ftbl"><thead><tr><th>Field</th><th>Value</th><th class="r">Page</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="panel side">${sideTabs('Source')}${side}</div></div>`;
}
function narr(){
  return runHead()+`<div class="cols"><div class="panel work"><div class="wh"><h2>Directors’ report text</h2><span class="sp"></span><button class="btn quiet sm" data-a="rep" data-k="DR">Back to fields</button></div>
   <div class="tb"><span class="sp"></span><span class="meta">p2–7</span></div>
   <div class="stage"><div class="a4"><div class="nh">DIRECTORS’ REPORT</div><p>The directors present their report together with the audited financial statements of the Company for the financial year ended 31 December 2024.</p><div class="nh">Principal activities</div><p>The principal activities of the Company are the marketing and distribution of pharmaceutical products. There have been no significant changes in the nature of these activities during the financial year.</p><div class="nh">Results</div><table><tr><td></td><td class="n">RM</td></tr><tr><td>Net profit for the financial year</td><td class="n">12,408,311</td></tr></table><div class="nh">Dividends</div><p>No dividend has been paid or declared by the Company since the end of the previous financial year.</p></div></div></div>
   <div class="panel side">${sideTabs('Source')}<div class="sb"><p class="meta">Choose a paragraph to see its page.</p></div></div></div>`;
}
function grid(){
  const R=[['hd','Current liabilities'],['','Trade payables','1,842,300','1,510,400','sign'],['','Other payables','620,150','598,200','lock'],['','Lease liabilities','220,000','204,500','lock'],['tot','Total current liabilities','2,682,450','2,313,100']];
  const side = st.sel==='sign' ? `<div class="sb"><div class="det"><div class="dh"><h3>Trade payables, last year</h3><span class="pill amber">Needs a person</span></div>
      <p>Last year’s workbook holds –1,510,400 and the report prints 1,510,400 as last year’s figure. Only the sign differs.</p>
      <div class="kv"><span>Last year’s workbook</span><span class="mono">–1,510,400</span><span>Report, page 13</span><span class="mono">1,510,400</span></div>
      <div class="bar"><button class="btn outline sm">Keep the workbook’s</button><button class="btn outline sm">Use the report’s</button></div></div></div>`
    : st.sel==='lock' ? `<div class="sb"><div class="det"><div class="dh"><h3>Other payables, last year</h3><span class="pill green">From workbook</span></div>
      <p class="meta">Kept as filed in last year’s workbook. It agrees with the report’s comparative on page 13.</p>
      <div class="bar"><textarea class="in" placeholder="Comment for the agent"></textarea></div></div></div>`
    : `<div class="sb"><p class="meta">Choose a figure.</p></div>`;
  return runHead()+`<div class="cols"><div class="panel work"><div class="wh"><h2>Financial position</h2><span class="sp"></span><div class="seg"><button class="on">Report</button><button>Template</button></div></div>
   <div class="wb"><table class="grid"><colgroup><col><col style="width:140px"><col style="width:140px"></colgroup><thead><tr><th>Line in report</th><th class="n">This year</th><th class="n">Last year</th></tr></thead><tbody>
   ${R.map(r=>r[0]==='hd'?`<tr class="hd"><td colspan="3">${r[1]}</td></tr>`:`<tr class="${r[0]}"><td class="lab${r[4]==='sign'?' mk':''}"><div>${r[1]}</div></td><td class="v">${r[2]}</td><td class="v${r[4]==='sign'?' mk':''}${st.sel===r[4]&&r[4]?' sel':''}" data-a="cell" data-v="${r[4]||''}">${r[3]}</td></tr>`).join('')}
   </tbody></table></div></div><div class="panel side">${sideTabs(st.sel?'Source':'Needs you')}${side}</div></div>`;
}
function modal(){
  if(st.modal==='fill') return `<div class="scrim"><div class="dlg"><h2>Prepare mTool file</h2>
    <div class="line"><span>Kemuncak_FY2023_mTool.xlsx</span><span class="meta">Starting workbook</span></div>
    <p>The run’s figures, notes and reports go into the workbook attached at setup. The 436 figures that came from it stay exactly as they are.</p>
    <div class="bar"><span class="sp"></span><button class="btn quiet" data-a="modal" data-v="">Cancel</button><button class="btn primary" data-a="modal" data-v="receipt">Fill workbook</button></div></div></div>`;
  if(st.modal==='receipt') return `<div class="scrim"><div class="dlg"><h2>mTool file ready</h2>
    <div class="stats"><div class="stat"><b>1,604</b><span>Written</span></div><div class="stat"><b>436</b><span>Kept from the workbook</span></div><div class="stat"><b>3</b><span>Not written</span></div></div>
    <table class="tbl flat"><tbody><tr><td>Identity number, director 2</td><td class="meta">Not shown in the report</td></tr><tr><td>Other income, this year</td><td class="meta">A person typed 12,000 in the workbook; the run has 12,400. Kept as typed.</td></tr><tr><td>Deferred tax assets</td><td class="meta">No matching cell in the workbook</td></tr></tbody></table>
    <div class="bar"><span class="sp"></span><button class="btn quiet" data-a="modal" data-v="">Close</button><button class="btn primary">Download</button></div></div></div>`;
  return '';
}
function render(){
  const v = {setup, report:reportView, narr, grid}[st.view]();
  document.getElementById('root').innerHTML = `<div class="app">${nav()}<main>${v}</main></div>${modal()}
  <div class="proto"><span>Prototype</span>
   <button data-a="go" data-v="setup" data-w="none">Setup</button><button data-a="go" data-v="setup" data-w="attached">Setup: workbook</button><button data-a="go" data-v="setup" data-w="refused">Setup: refused</button>
   <button data-a="rep" data-k="DR">Reports</button><button data-a="go" data-v="grid">Imported figures</button><button data-a="go" data-v="grid" data-m="fill">Fill</button></div>`;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t) return;
  const a=t.dataset.a;
  if(a==='go'){st.view=t.dataset.v; if(t.dataset.w) st.wb=t.dataset.w; st.sel=null; st.modal=t.dataset.m||null;}
  else if(a==='wb'){st.wb=t.dataset.v;}
  else if(a==='rep'){st.view='report'; st.report=t.dataset.k; st.field=null;}
  else if(a==='grid'){st.view='grid'; st.sel=null;}
  else if(a==='field'){if(e.target.closest('select,input')) return; st.field=+t.dataset.i;}
  else if(a==='view'){st.view=t.dataset.v;}
  else if(a==='cell'){st.sel=t.dataset.v||null;}
  else if(a==='modal'){st.modal=t.dataset.v||null;}
  render();
});
render();
</script></body></html>
