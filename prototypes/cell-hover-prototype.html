<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell hover</title>
<style>
/* Builds on polish-prototype.html (approved). Proposal: a box around the figure or line under the pointer. Data is invented. */
:root{
  --bg:#EEEFF1;--panel:#FFFFFF;--tint:#F5F7F8;--line:#DFE3E6;--edge:#CBD1D6;--ink:#111111;--muted:#6B7280;--faint:#B5BCC4;
  --nav:#000000;--nav-ink:#FFFFFF;--nav-muted:#9AA1A9;--nav-on:#1F1F1F;--nav-group:#6B7280;--nav-accent:#FE7C39;
  --accent:#FD5108;--accent-text:#D64000;--accent-soft:#FFF5ED;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;
  --radius:12px;--radius-sm:8px;--pill:999px;--ring:1.5px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fast:120ms;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:14px;line-height:20px;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:232px 1fr;height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
h1,h2{font-weight:500;margin:0}
.nav{background:var(--nav);color:var(--nav-ink);padding:var(--s4) var(--s3)}
.brand{display:flex;gap:var(--s2);align-items:center;padding:var(--s2) var(--s3) var(--s4);font-weight:500}
.brand i{width:14px;height:14px;border-radius:4px;background:var(--nav-accent)}
.grp{color:var(--nav-group);font-size:12px;padding:var(--s5) var(--s3) var(--s1)}
.nav div.i{display:flex;justify-content:space-between;height:32px;align-items:center;padding:0 var(--s3);border-radius:var(--radius-sm);color:var(--nav-muted)}
.nav div.i.on{background:var(--nav-on);color:var(--nav-ink)}
main{display:flex;flex-direction:column;min-width:0;padding:0 var(--s5) var(--s5);overflow:hidden}
.head{height:80px;display:flex;align-items:center}
.head h1{font-size:22px}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:var(--s4)}
.panel{background:var(--panel);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.ph{height:64px;flex:none;display:flex;align-items:center;padding:0 var(--s5)}
.ph h2{font-size:16px}
.pb{flex:1;min-height:0;overflow:auto;padding:0 var(--s5) var(--s5)}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:400;text-align:left;height:32px;padding:0 var(--s3);z-index:1}
th.n{text-align:right;width:18%}
td{height:36px;padding:0}
tr.hd td{font-weight:500;padding:var(--s5) var(--s3) var(--s1);height:auto}
tr.tot td{font-weight:500}
.cell{display:flex;align-items:center;width:100%;height:36px;padding:0 var(--s3);border-radius:var(--radius-sm);transition:background var(--fast),box-shadow var(--fast)}
td.v .cell{justify-content:flex-end;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.rule td.v .cell span{border-top:1px solid var(--ink);padding-top:var(--s1);margin-top:calc(-1*var(--s1))}
.rowstat{color:var(--accent-text);margin-left:var(--s2)}
.sel .cell,.cell.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 var(--ring) var(--accent)}

/* Today: the whole row tints. */
body.today tbody tr.line:hover td{background:var(--tint)}
body.today .cell{border-radius:0}
/* Proposed: the figure or name under the pointer gets its own box; the row keeps a faint tint so the eye can follow it across. */
body.box tbody tr.line:hover td{background:var(--tint)}
body.box .cell:hover:not(.sel){background:var(--panel);box-shadow:inset 0 0 0 1px var(--edge)}
/* Box only: no row tint. */
body.only .cell:hover:not(.sel){background:var(--tint);box-shadow:inset 0 0 0 1px var(--edge)}

.side h3{font-size:14px;font-weight:500;margin:0 0 var(--s4)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:var(--s2) var(--s4)}
.kv span:nth-child(odd){color:var(--muted)}
.empty{color:var(--muted)}
.proto{position:fixed;right:16px;bottom:16px;background:#fff;border-radius:var(--radius);box-shadow:0 4px 24px rgba(0,0,0,.12);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s2);font-size:13px;z-index:9;width:340px}
.proto b{font-weight:500}
.proto p{margin:0;color:var(--muted)}
.seg{display:inline-flex;background:var(--tint);border-radius:var(--pill);padding:2px}
.seg button{height:26px;padding:0 var(--s3);border-radius:var(--pill);color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink)}
</style>
</head>
<body class="box">
<nav class="nav"><div class="brand"><i></i>XBRL Agent</div><div class="i">Runs</div><div class="grp">Statements</div><div class="i on">Financial position</div><div class="i">Profit or loss</div><div class="i">Checks</div></nav>
<main>
  <div class="head"><h1>Kemuncak Logistik Sdn. Bhd.</h1></div>
  <div class="cols"><section class="panel"><div class="ph"><h2>Financial position</h2></div><div class="pb" id="grid"></div></section>
  <section class="panel side"><div class="ph"><h2>Source</h2></div><div class="pb" id="side"></div></section></div>
</main>
<div class="proto">
  <b>Prototype</b>
  <span class="seg" id="look"><button data-v="today">Today</button><button data-v="box" class="on">Box and row</button><button data-v="only">Box only</button></span>
  <p>Point at a figure or a line name. Click to open it in Source.</p>
</div>
<script>
const ROWS=[
 ['hd','Non-current assets'],
 ['ln','Property, plant and equipment','4,812,330','4,355,901'],
 ['ln','Right-of-use assets','829,990','1,183,317'],
 ['ln','Deferred tax assets','296,082','280,531'],
 ['tot','Total non-current assets','5,938,402','5,819,749'],
 ['hd','Current assets'],
 ['ln','Trade receivables','3,214,866','2,904,120','Does not tally'],
 ['ln','Amounts due from related companies','2,729,209','3,762,972','Unsure'],
 ['ln','Cash and bank balances','10,255,059','6,245,254'],
 ['tot','Total current assets','16,199,134','12,912,346'],
 ['tot','Total assets','22,137,536','18,732,095'],
 ['hd','Equity'],
 ['ln','Share capital','5,000,000','5,000,000'],
 ['ln','Retained earnings','9,412,551','7,106,218'],
 ['tot','Total equity','14,594,810','12,281,660'],
];
let sel=null;
const $=s=>document.querySelector(s);
function draw(){
  let h='<table><thead><tr><th>Line in report</th><th class="n">This year</th><th class="n">Last year</th></tr></thead><tbody>';
  ROWS.forEach((r,i)=>{
    if(r[0]==='hd'){h+=`<tr class="hd"><td colspan="3">${r[1]}</td></tr>`;return}
    const on=k=>sel&&sel.i===i&&sel.k===k?'sel':'';
    h+=`<tr class="line ${r[0]==='tot'?'tot rule':''}"><td><button class="cell ${on('l')}" data-i="${i}" data-k="l">${r[1]}${r[4]?`<span class="rowstat">${r[4]}</span>`:''}</button></td>
      <td class="v"><button class="cell ${on('a')}" data-i="${i}" data-k="a"><span>${r[2]}</span></button></td>
      <td class="v"><button class="cell ${on('b')}" data-i="${i}" data-k="b"><span>${r[3]}</span></button></td></tr>`;
  });
  $('#grid').innerHTML=h+'</tbody></table>';
  const r=sel&&ROWS[sel.i];
  $('#side').innerHTML=!r?'':`<h3>${r[1]}</h3><div class="kv">${sel.k==='l'?`<span>This year</span><span>${r[2]}</span><span>Last year</span><span>${r[3]}</span>`:`<span>${sel.k==='a'?'This year':'Last year'}</span><span>${sel.k==='a'?r[2]:r[3]}</span><span>Page</span><span>13</span>`}</div>`;
}
$('#grid').onclick=e=>{const b=e.target.closest('.cell');if(!b)return;sel={i:+b.dataset.i,k:b.dataset.k};draw()};
$('#look').onclick=e=>{const v=e.target.dataset.v;if(!v)return;document.body.className=v;$('#look').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))};
draw();
</script>
</body>
</html>
