<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XBRL Agent v2 prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F3F1; --panel:#FFFFFF; --tint:#F7F7F5; --line:#E9E9E6; --text:#1A1A19; --muted:#6C6C68;
  --accent:#C63D00; --accent-soft:#FBEDE6; --black:#111110;
  --green-bg:#E3F1E7; --green:#1F6B3A; --amber-bg:#FBEFD5; --amber:#855600; --red-bg:#FBE4E1; --red:#A12A1E; --grey-bg:#EDEDEA; --grey:#4A4A47;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 14px/20px Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-width:1280px}
h1,h2,h3,p{margin:0}
h1{font-weight:500;font-size:20px;line-height:28px;letter-spacing:-.01em}
h2{font-weight:500;font-size:16px;line-height:24px}
h3{font-weight:500;font-size:14px;line-height:20px}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100vh;display:flex;flex-direction:column}
.top{height:56px;flex:none;display:flex;align-items:center;gap:32px;padding:0 24px}
.brand{font-weight:500}
.top a{color:var(--muted);text-decoration:none;cursor:pointer}
.top a.on{color:var(--text)}
.top .sp{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--grey-bg);display:grid;place-items:center;font-size:12px}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 24px 80px}
.ph{display:flex;align-items:center;gap:12px;padding:8px 0 16px;flex:none;min-height:60px}
.ph .sp{flex:1}
.meta{color:var(--muted)}
.panel{background:var(--panel);border-radius:12px;min-height:0}
.pad{padding:24px}
.narrow>*{flex:none}
.narrow{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:16px;overflow:auto}

/* buttons */
.btn{height:36px;padding:0 16px;border-radius:999px;border:1px solid transparent;background:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--black);color:#fff}
.btn.outline{border-color:#D6D6D2}
.btn.quiet{padding:0 8px;color:var(--muted)}
.btn.quiet:hover{color:var(--text)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{height:28px;padding:0 12px;font-size:13px}
.icon{width:28px;height:28px;border-radius:8px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.icon:hover,.icon.on{background:var(--grey-bg);color:var(--text)}
.icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon b,.icon i,.icon u{font:500 14px/1 Georgia,serif}

/* pills, segments, inputs */
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;white-space:nowrap;background:var(--grey-bg);color:var(--grey)}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.red{background:var(--red-bg);color:var(--red)}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:4px}
.seg button{height:28px;padding:0 12px;border:0;border-radius:999px;background:none;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text)}
.in,select.in,textarea.in{width:100%;height:36px;padding:0 12px;border:0;border-radius:12px;background:var(--bg);outline:none}
textarea.in{height:72px;padding:8px 12px;resize:none;line-height:20px;display:block}
.in:focus{box-shadow:0 0 0 2px #D6D6D2}
.switch{width:36px;height:20px;border-radius:999px;border:0;background:#CFCFCB;position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .12s}
.switch.on{background:var(--black)}
.switch.on::after{left:18px}

/* tables */
table{border-collapse:collapse;width:100%}
.tbl th{font-weight:400;color:var(--muted);text-align:left;height:36px;padding:0 12px;border-bottom:1px solid var(--line)}
.tbl td{height:44px;padding:0 12px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--tint)}
.tbl.flat tbody tr{cursor:default}
.tbl.flat tbody tr:hover td{background:none}
.r{text-align:right}
.num{font-variant-numeric:tabular-nums}

/* review layout */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:208px minmax(0,1fr) 400px;gap:16px}
.rail{padding:16px 8px;overflow:auto}
.rail .grp{color:var(--muted);font-size:12px;padding:16px 12px 4px}
.rail .grp:first-child{padding-top:0}
.rail a{display:flex;align-items:center;justify-content:space-between;gap:8px;height:32px;padding:0 12px;border-radius:8px;cursor:pointer}
.rail a:hover{background:var(--tint)}
.rail a.on{background:var(--bg)}
.rail a.sub{padding-left:24px;color:var(--muted)}
.rail a.sub.on{color:var(--text)}
.rail a span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--amber-bg);color:var(--amber);font-size:12px;display:grid;place-items:center;flex:none}
.work,.side{display:flex;flex-direction:column;overflow:hidden}
.wh{flex:none;height:64px;display:flex;align-items:center;gap:12px;padding:0 24px}
.wh .sp{flex:1}
.wh>*{flex:none}
.wh h2{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{flex:1;min-height:0;overflow:auto;padding:0 24px 24px}
.work.locked .wb{opacity:.5;pointer-events:none}

/* grid */
.grid{table-layout:fixed}
.grid th{position:sticky;top:0;background:#fff;font-weight:400;color:var(--muted);height:32px;padding:0 12px;border-bottom:1px solid var(--line);z-index:1}
.grid td{height:36px;padding:0 12px;border-bottom:1px solid var(--line)}
.grid td.lab{padding-left:24px}
.grid tr.hd td{font-weight:500;padding-left:0;border-bottom:0;height:44px;vertical-align:bottom;padding-bottom:6px}
.grid tr.tot td{border-top:1px solid var(--text)}
.grid tr.tot td.lab{padding-left:0}
.grid td.v{text-align:right;font-variant-numeric:tabular-nums;cursor:pointer;position:relative}
.grid td.v:hover{background:var(--tint)}
.grid td.v.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.grid td.v.mk::after{content:"";position:absolute;top:4px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.grid td.st{text-align:right;padding-right:0}
.empty{color:var(--muted);padding:48px 0;text-align:center}

/* side */
.tabs{flex:none;height:64px;display:flex;align-items:center;gap:24px;padding:0 24px}
.tabs a{cursor:pointer;color:var(--muted);height:64px;display:flex;align-items:center;gap:8px}
.tabs a.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--text)}
.sb{flex:1;min-height:0;overflow:auto;padding:16px 24px 24px;display:flex;flex-direction:column;gap:16px}
.frow{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:12px}
.frow>span{color:var(--muted)}
.det{display:flex;flex-direction:column;gap:12px}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.why{color:var(--muted)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:28px;padding:0 12px;border-radius:999px;border:1px solid #D6D6D2;background:none;cursor:pointer;font-size:13px}
.chip:hover{background:var(--tint)}
.pgwrap{background:var(--bg);border-radius:12px;padding:16px}
.pgh{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding-bottom:12px}
.page{background:#fff;padding:24px 20px;font:400 11.5px/17px Georgia,"Times New Roman",serif;color:#222}
.page .co{text-align:center;font-weight:700}
.page .ti{text-align:center;margin-bottom:12px}
.page table td{padding:1px 0 1px 8px}
.page table td:first-child{padding-left:0}
.page td.n{text-align:right;width:84px;font-variant-numeric:tabular-nums}
.page tr.h td{font-weight:700;padding-top:8px}
.page tr.t td.n{border-top:1px solid #222}
.page tr.hl td{background:#FFF1B8}
.page td.dbl{border-bottom:3px double #222}
.cm{background:var(--tint);border-radius:12px;padding:12px 12px 12px 16px;display:flex;flex-direction:column;gap:8px}
.cm .loc{font-weight:500;cursor:pointer}
.cm .ba{font-variant-numeric:tabular-nums}
.cm s{color:var(--muted)}

/* notes */
.tb{flex:none;display:flex;align-items:center;gap:4px;padding:0 24px 12px}
.tb .div{width:1px;height:20px;background:var(--line);margin:0 8px}
.tb .sp{flex:1}
.stage{flex:1;min-height:0;overflow:auto;background:var(--bg);margin:0 24px 24px;border-radius:12px;padding:24px}
.a4{background:#fff;max-width:640px;margin:0 auto;padding:40px 44px;font:400 13px/19px Arial,Helvetica,sans-serif;color:#000;min-height:560px}
.a4 .nh{font-weight:700;margin-bottom:10px;cursor:pointer}
.a4 p{margin-bottom:10px;text-align:justify;cursor:pointer}
.a4 table{margin-bottom:12px}
.a4 td{padding:2px 4px;cursor:pointer;vertical-align:bottom}
.a4 .hit{background:var(--accent-soft)}
.a4 .has{box-shadow:inset 3px 0 0 var(--accent)}

/* setup, settings */
.sec{display:flex;flex-direction:column;gap:16px}
.line{display:flex;align-items:center;gap:16px;min-height:36px}
.line>span:first-child{flex:1}
.line .ctl{width:240px;flex:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>span{color:var(--muted)}
.drop{border:1.5px dashed #CFCFCB;border-radius:12px;height:240px;display:grid;place-items:center;text-align:center}
.drop div{display:flex;flex-direction:column;gap:16px;align-items:center}
.gl{display:flex;align-items:center;gap:12px;min-height:36px;padding:0 4px 0 12px;background:var(--tint);border-radius:12px}
.gl span{flex:1}
.stg td{height:52px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,20,19,.32);display:grid;place-items:center;z-index:20}
.dlg{width:520px;background:#fff;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{background:var(--tint);border-radius:12px;padding:16px}
.stat b{display:block;font-weight:500;font-size:24px;line-height:32px}
.stat span{color:var(--muted)}

/* prototype bar */
.proto{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#111110;color:#fff;border-radius:999px;height:44px;padding:0 8px 0 16px;display:flex;align-items:center;gap:4px;z-index:30;font-size:13px}
.proto span{color:#9A9A95;margin-right:8px}
.proto button{height:28px;padding:0 12px;border-radius:999px;border:0;background:none;color:#fff;cursor:pointer}
.proto button:hover{background:#2E2E2B}
</style>
</head>

const fmt = v => v==null ? '' : v<0 ? '('+Math.abs(v).toLocaleString('en-US')+')' : v.toLocaleString('en-US');

const val = (s,r,ci) => r.t==='total' ? r.of.reduce((a,id)=>a+(val(s,row(s,id),ci)||0),0) : r.v ? r.v[ci] : null;
const sofpDiff = ci => val('sofp',row('sofp','ta'),ci) - val('sofp',row('sofp','tel'),ci);
const ck = (s,id,ci) => s+'|'+id+'|'+ci;
const openC = () => st.comments.filter(c=>!c.out);

const cOn = (s,id,ci) => st.comments.some(c=>!c.done && c.t.s===s && c.t.row===id && c.t.ci===ci);
function rowStatus(s,r){

  for(let i=0;i<n;i++) if(st.changed.has(ck(s,r.id,i))) return ['','Changed'];

}

/* ---------- note styles ---------- */
function base(n,bi,ri,ci){
  const b = NOTE[n].blocks[bi]; if(b.k!=='t') return {};
  if(ri<0) return {al:ci?'right':'left',bb:'thin'};
  const r = b.rows[ri], o = {al:ci?'right':'left'};
  if(r.sub) o.b = 1;
  if(r.total && ci){o.bt='thin';o.bb='thick'}
  return o;
}
const sty = (n,bi,ri,ci) => Object.assign({}, base(n,bi,ri,ci), st.styles[[n,bi,ri,ci].join('|')]||{});
function css(o,src){
  let c = 'text-align:'+(o.al||'left')+';';
  if(o.b) c+='font-weight:700;'; if(o.i) c+='font-style:italic;'; if(o.u) c+='text-decoration:underline;';
  if(o.ind) c+='padding-left:'+(4+o.ind*16)+'px;';
  if(o.bt) c+='border-top:1px solid #000;';
  if(o.bb==='thin') c+='border-bottom:1px solid #000;';
  if(o.bb==='thick') c+= src ? 'border-bottom:3px double #000;' : 'border-bottom:2.5px solid #000;';
  return c;
}
function targets(){
  const s = st.nsel; if(!s) return [];
  const b = NOTE[s.n].blocks[s.bi];
  if(b.k!=='t') return [[s.n,s.bi,0,0]];
  const R = b.rows.length, C = b.head.length, out = [];
  for(let r=-1;r<R;r++) for(let c=0;c<C;c++){
    if(s.scope==='table' || (s.scope==='row'&&r===s.ri) || (s.scope==='col'&&c===s.ci) || (s.scope==='cell'&&r===s.ri&&c===s.ci)) out.push([s.n,s.bi,r,c]);
  }
  return out;
}
const isHit = (n,bi,ri,ci) => targets().some(t=>t[0]===n&&t[1]===bi&&t[2]===ri&&t[3]===ci);
function setStyle(k,v){
  const ts = targets(); if(!ts.length) return;
  const cur = sty(...ts[0])[k];
  const nv = v===undefined ? (cur?0:1) : (cur===v && k==='bb' ? '' : v);
  ts.forEach(t=>{const key=t.join('|'); st.styles[key]=Object.assign(st.styles[key]||{}, {[k]:nv});});
}
function noteHtml(n,src){
  return NOTE[n].blocks.map((b,bi)=>{
    const has = !src && st.comments.some(c=>!c.done&&c.t.note===n&&c.t.bi===bi) ? ' has' : '';
    if(b.k==='h') return `<div class="nh${!src&&isHit(n,bi,0,0)?' hit':''}${has}" ${src?'':`data-a="nsel" data-bi="${bi}" data-ri="0" data-ci="0"`} style="${src?'':css(Object.assign({b:1},st.styles[[n,bi,0,0].join('|')]||{}))}">${b.text}</div>`;
    if(b.k==='p') return `<p class="${!src&&isHit(n,bi,0,0)?'hit':''}${has}" ${src?'':`data-a="nsel" data-bi="${bi}" data-ri="0" data-ci="0"`} style="${src?'':css(Object.assign({al:'justify'},st.styles[[n,bi,0,0].join('|')]||{}))}">${b.text}</p>`;
    const tr = (cells,ri) => '<tr>'+cells.map((t,ci)=>{
      const o = src ? base(n,bi,ri,ci) : sty(n,bi,ri,ci);
      return `<td class="${!src&&isHit(n,bi,ri,ci)?'hit':''}" ${src?'':`data-a="nsel" data-bi="${bi}" data-ri="${ri}" data-ci="${ci}"`} style="${css(o,src)}">${t||'&nbsp;'}</td>`;
    }).join('')+'</tr>';
    return `<table class="${has.trim()}">${tr(b.head,-1)}${b.rows.map((r,ri)=>tr(r.c,ri)).join('')}</table>`;
  }).join('');
}

  const d = S[s];
  return `<div class="pgwrap"><div class="pgh"><span>Page ${d.page}</span><span>${d.page} of 48</span></div><div class="page"><div class="co">${CO.toUpperCase()}</div><div class="ti">${d.title}</div><table>
  <tr><td></td>${d.cols.map(c=>`<td class="n"><b>${c}</b></td>`).join('')}</tr>
  ${d.rows.filter(r=>!r.nosrc).map(r=>r.t==='head'?`<tr class="h"><td colspan="${d.cols.length+1}">${r.l}</td></tr>`:
    `<tr class="${r.t==='total'?'t':''}${hl===r.id?' hl':''}"><td>${r.l}</td>${d.cols.map((_,ci)=>{const v = r.t==='total' ? r.of.reduce((a,id)=>a+srcVal(s,row(s,id),ci),0) : srcVal(s,r,ci);return `<td class="n">${v?fmt(v):'–'}</td>`}).join('')}</tr>`).join('')}
  </table></div></div>`;
}
const SRC0 = JSON.parse(JSON.stringify(Object.fromEntries(Object.keys(S).map(s=>[s,Object.fromEntries(S[s].rows.filter(r=>r.v).map(r=>[r.id,r.src||r.v]))]))));
const srcVal = (s,r,ci) => r.t==='total' ? r.of.reduce((a,id)=>a+srcVal(s,row(s,id),ci),0) : (SRC0[s][r.id]||[])[ci]||0;
function commentBox(redo){
  return `<textarea class="in" id="cbox" placeholder="Comment for the agent">${esc(st.draft)}</textarea><div class="bar">${redo?'<button class="btn outline" data-a="redo">Redo from source</button>':''}<span class="sp"></span><button class="btn outline" data-a="addComment">Add comment</button></div>`;
}
function cellSide(){
  const s = st.sec, c = st.cell;
  if(!c) return (st.phase==='working'||st.phase==='reviewed' ? '' : `<div class="det"><div class="dh"><h3>${S[s].name}</h3></div>${commentBox()}</div>`) + srcPage(s);
  const r = row(s,c.row), v = val(s,r,c.ci), x = rowStatus(s,r), items = S[s].rows.filter(q=>!q.t);
  let mid = '';
  const ro = st.phase==='working'||st.phase==='reviewed';
  if(r.t==='total' || ro){
    mid = `<div class="frow"><span>${S[s].cols[c.ci]}</span><span class="num">${fmt(v)}</span></div>`;
    if(s==='sofp' && r.id==='tel' && sofpDiff(c.ci)) mid += `<p class="why">Differs from total assets by ${fmt(Math.abs(sofpDiff(c.ci)))}</p>`;
  } else {
    mid = `<div class="frow"><span>${S[s].cols[c.ci]}</span><input class="in num" style="text-align:right" data-c="value" value="${fmt(v)}"></div>
    <div class="frow"><span>Row</span><select class="in" data-c="move">${items.map(q=>`<option value="${q.id}"${q.id===r.id?' selected':''}>${q.l}</option>`).join('')}</select></div>`;
    if(r.flag && r.flag[c.ci]) mid += `<div class="bar"><p class="why" style="flex:1">${r.flag[c.ci]}</p><button class="btn outline sm" data-a="confirm">Confirm</button></div>`;
  }
  return `<div class="det"><div class="dh"><h3>${r.l}</h3>${x?`<span class="pill ${x[0]}">${x[1]}</span>`:''}</div>${mid}${st.phase==='working'||st.phase==='reviewed'?'':commentBox()}</div>${srcPage(s,r.id)}`;
}
function noteSide(){
  const n = st.note, d = NOTE[n], s = st.nsel;
  const b = s ? d.blocks[s.bi] : null;
  const rule = s && b.k==='t' && s.ri>=0 && b.rows[s.ri].total && (s.scope==='cell'||s.scope==='row') ? `<p class="why">Double underline shown as thick border</p>` : '';
  const chips = ['Columns misaligned','Rows merged wrongly','Text missing','Heading level wrong','Total line missing'];
  const form = st.phase==='working'||st.phase==='reviewed' ? '' : `<div class="det">${s?`<div class="dh"><h3>${selLabel()}</h3></div>`:''}${rule}<div class="chips">${chips.map(c=>`<button class="chip" data-a="chip">${c}</button>`).join('')}</div>${commentBox(1)}</div>`;
  return form + `<div class="pgwrap"><div class="pgh"><span>Page ${d.page}</span><span>${d.page} of 48</span></div><div class="page" style="font-size:10.5px;line-height:15px">${noteHtml(n,1)}</div></div>`;
}
function selLabel(){
  const s = st.nsel; if(!s) return NOTE[st.note].title;
  const b = NOTE[s.n].blocks[s.bi];
  if(b.k==='h') return 'Heading'; if(b.k==='p') return 'Paragraph';
  if(s.scope==='table') return 'Table';
  if(s.scope==='col') return 'Column: '+(b.head[s.ci]||'Labels');
  const rl = s.ri<0 ? 'Header row' : (b.rows[s.ri].c[0]||'Total');
  return s.scope==='row' ? 'Row: '+rl : rl+(b.head[s.ci]?' · '+b.head[s.ci]:'');
}
function commentList(){
  const list = st.comments.filter(c=>!c.done);
  if(!list.length) return `<div class="empty">No comments</div>`;
  const pl = {changed:['green','Changed'],same:['','Not changed'],question:['amber','Question']};
  return list.map(c=>{
    let o = '';
    if(st.phase==='working') o = `<div><span class="pill amber">Working</span></div>`;
    else if(c.out){
      const p = pl[c.out.k];
      o = `<div><span class="pill ${p[0]}">${p[1]}</span></div><p>${c.out.text}</p>${c.out.ba?`<p class="ba"><s>${c.out.ba[0]}</s> → ${c.out.ba[1]}</p>`:''}`;
      if(c.out.k==='question') o += `<textarea class="in" id="rep-${c.id}" placeholder="Reply"></textarea><div class="bar"><span class="sp"></span><button class="btn outline sm" data-a="reply" data-id="${c.id}">Reply</button></div>`;
      else o += `<div class="bar"><span class="sp"></span>${c.out.k==='changed'?`<button class="btn quiet sm" data-a="undo" data-id="${c.id}">Undo</button>`:''}<button class="btn outline sm" data-a="accept" data-id="${c.id}">${c.out.k==='changed'?'Accept':'Done'}</button></div>`;
    }
    return `<div class="cm"><div class="dh"><span class="loc" data-a="goto" data-id="${c.id}">${c.loc}</span>${c.out||st.phase==='working'?'':`<button class="icon" title="Remove" data-a="cdel" data-id="${c.id}">${ico('x')}</button>`}</div><p>${esc(c.text)}</p>${o}</div>`;
  }).join('');
}
function modal(){
  if(st.modal==='fill') return `<div class="scrim"><div class="dlg"><h2>Prepare mTool file</h2><div class="line"><span>SeriMaju_MFRS_Company_2025.xlsx</span><button class="btn outline sm">Replace</button></div><div class="bar"><span class="sp"></span><button class="btn quiet" data-a="modal" data-m="">Cancel</button><button class="btn primary" data-a="modal" data-m="receipt">Fill template</button></div></div></div>`;
  if(st.modal==='receipt') return `<div class="scrim"><div class="dlg"><h2>mTool file ready</h2><div class="stats"><div class="stat"><b>214</b><span>Written</span></div><div class="stat"><b>3</b><span>Skipped</span></div><div class="stat"><b>11</b><span>Notes</span></div></div>
    <table class="tbl flat"><tbody><tr><td style="padding-left:0">Other comprehensive income</td><td class="r meta">No value in source</td></tr><tr style="cursor:default"><td style="padding-left:0">Amounts due from related parties, 2024</td><td class="r meta">No value in source</td></tr><tr style="cursor:default"><td style="padding-left:0">Contingent liabilities</td><td class="r meta">Placed in other notes</td></tr></tbody></table>
    <div class="bar"><span class="sp"></span><button class="btn quiet" data-a="modal" data-m="">Close</button><button class="btn primary" data-a="modal" data-m="">Download</button></div></div></div>`;
  return '';
}
function render(){
  const v = {runs,new:newRun,setup,progress,review,settings}[st.view]();
  document.getElementById('root').innerHTML = `<div class="app">${topBar()}<main>${v}</main></div>${modal()}
  <div class="proto"><span>Prototype</span>${[['runs','Runs'],['new','New run'],['progress','Progress'],['review','Review'],['results','Results'],['reviewed','Reviewed']].map(x=>`<button data-a="proto" data-p="${x[0]}">${x[1]}</button>`).join('')}</div>`;
}

/* ---------- agent simulation ---------- */
function resolve(c){
  const t = c.t;
  if(t.kind==='cell'){
    const r = row(t.s,t.row);
    if(t.s==='sofp' && t.row==='orecv' && t.ci===0 && r.v[0]===318450){
      const rp = row('sofp','relp'); r.v[0]=276450; rp.v[0]=42000; delete r.flag;
      st.changed.add(ck('sofp','orecv',0)); st.changed.add(ck('sofp','relp',0));
      c.undo = ()=>{r.v[0]=318450; rp.v[0]=null; st.changed.delete(ck('sofp','orecv',0)); st.changed.delete(ck('sofp','relp',0));};
      return {k:'changed',text:'Moved 42,000 due from a director to amounts due from related parties.',ba:['318,450','276,450']};
    }
    if(t.s==='sofp' && t.row==='opay' && t.ci===1 && r.v[1]!==398200){
      const old = r.v[1]; r.v[1]=398200; st.changed.add(ck('sofp','opay',1));
      c.undo = ()=>{r.v[1]=old; st.changed.delete(ck('sofp','opay',1));};
      return {k:'changed',text:'Page 7 prints 398,200.',ba:[fmt(old),'398,200']};
    }
    return {k:'same',text:'Page '+S[t.s].page+' prints this figure as shown.'};
  }
  if(t.kind==='stmt') return c.replied ? {k:'same',text:'The rows already follow page '+S[t.s].page+'.'} : {k:'question',text:'Which rows should change?'};
  const keys = Object.keys(st.styles).filter(k=>k.startsWith(t.note+'|'));
  if(keys.length || NOTE[t.note].flag){
    const old = {}; keys.forEach(k=>{old[k]=st.styles[k]; delete st.styles[k];});
    const f = NOTE[t.note].flag; NOTE[t.note].flag = 0;
    c.undo = ()=>{Object.assign(st.styles,old); NOTE[t.note].flag=f;};
    return {k:'changed',text:'Alignment and total lines matched to page '+NOTE[t.note].page+'.'};
  }
  return {k:'same',text:'Formatting matches page '+NOTE[t.note].page+'.'};
}
function finish(){
  if(st.phase!=='working') return;
  openC().forEach(c=>{c.out = resolve(c);});
  st.phase='results'; st.tab='comments'; render();
}
function addC(t,loc,text){ st.comments.push({id:st.seq++,t,loc,text}); }

/* ---------- actions ---------- */
const A = {
  go:d=>{st.view=d.v;},
  sw:(d,el)=>{el.classList.toggle('on'); return 1;},
  segpick:(d,el)=>{[...el.parentNode.children].forEach(b=>b.classList.remove('on')); el.classList.add('on'); return 1;},
  gadd:d=>{const i=document.getElementById('g-'+d.k); if(i.value.trim()) st[d.k].push(i.value.trim());},
  gdel:d=>{st[d.k].splice(+d.i,1);},
  sec:d=>{st.sec=d.s; st.cell=null; st.tpl=null; st.note=null; st.nsel=null; st.draft=''; st.tab = d.s==='checks' || st.phase==='results' ? 'comments' : 'source';},
  tpl:d=>{st.tpl=d.t; A.note({n:T[d.t].notes[0]});},
  note:d=>{st.sec='note'; st.note=d.n; st.nsel=null; st.cell=null; st.draft=''; if(st.tab==='comments'&&st.phase==='review') st.tab='source';},
  cell:d=>{st.cell={row:d.row,ci:+d.ci}; st.tab='source'; st.draft='';},
  filter:d=>{st.filter=d.f;},
  tab:d=>{st.tab=d.t;},
  jump:d=>{st.sec=d.s; st.cell={row:d.row,ci:d.s==='sofp'&&sofpDiff(1)?1:0}; st.tab='source'; st.filter='all';},
  confirm:()=>{const r=row(st.sec,st.cell.row); delete r.flag[st.cell.ci];},
  confirmNote:()=>{NOTE[st.note].flag=0;},
  stmtComment:()=>{st.cell=null; st.tab='source'; setTimeout(()=>{const b=document.getElementById('cbox'); if(b) b.focus();});},
  addComment:()=>{
    const text = document.getElementById('cbox').value.trim(); if(!text) return 1;
    if(st.sec==='note'){
      const s = st.nsel; addC({kind:'note',note:st.note,bi:s?s.bi:-1}, NOTE[st.note].title+(s?' · '+selLabel():''), text);
    } else if(st.cell){
      const r = row(st.sec,st.cell.row); addC({kind:'cell',s:st.sec,row:r.id,ci:st.cell.ci}, r.l+' · '+S[st.sec].cols[st.cell.ci], text);
    } else addC({kind:'stmt',s:st.sec}, S[st.sec].name, text);
    st.draft='';
  },
  chip:(d,el)=>{const b=document.getElementById('cbox'); b.value = b.value ? b.value+'. '+el.textContent : el.textContent; st.draft=b.value; b.focus(); return 1;},
  redo:()=>{addC({kind:'note',note:st.note,bi:-1}, NOTE[st.note].title, 'Redo from source');},
  cdel:d=>{st.comments = st.comments.filter(c=>c.id!==+d.id);},
  goto:d=>{const c=st.comments.find(c=>c.id===+d.id), t=c.t;
    if(t.kind==='note'){st.sec='note'; st.note=t.note; st.tpl=Object.keys(T).find(k=>T[k].notes.includes(t.note)); st.nsel=null;}
    else {st.sec=t.s; st.tpl=null; st.note=null; st.cell=t.kind==='cell'?{row:t.row,ci:t.ci}:null;}},
  send:()=>{st.phase='working'; st.tab='comments'; setTimeout(finish,2600);},
  stop:()=>{st.phase='review';},
  accept:d=>{st.comments.find(c=>c.id===+d.id).done=1; if(!pendC().length&&!openC().length) st.phase='review';},
  acceptAll:()=>{pendC().filter(c=>c.out.k!=='question').forEach(c=>c.done=1); if(!pendC().length) st.phase='review';},
  undo:d=>{const c=st.comments.find(c=>c.id===+d.id); if(c.undo) c.undo(); c.done=1; if(!pendC().length&&!openC().length) st.phase='review';},
  reply:d=>{const c=st.comments.find(c=>c.id===+d.id), v=document.getElementById('rep-'+d.id).value.trim(); if(!v) return 1; c.text+=' — '+v; c.out=null; c.replied=1; st.phase='review';},
  sign:()=>{st.phase='reviewed';},
  reopen:()=>{st.phase='review';},
  modal:d=>{st.modal=d.m||null;},
  nsel:d=>{const p={n:st.note,bi:+d.bi,ri:+d.ri,ci:+d.ci}; p.scope = st.nsel && st.nsel.bi===p.bi && NOTE[st.note].blocks[p.bi].k==='t' ? st.nsel.scope : 'cell'; st.nsel=p; st.tab='source';},
  scope:d=>{st.nsel.scope=d.s;},
  fmt:d=>{
    if(!st.nsel || st.phase==='working' || st.phase==='reviewed') return 1;
    if(d.k==='ind'){const cur=sty(...targets()[0]).ind||0; setStyle('ind',Math.max(0,Math.min(4,cur+(d.val==='+'?1:-1))));}
    else if(d.k==='none'){setStyle('bt',0); targets().forEach(t=>{st.styles[t.join('|')].bb='';});}
    else if(d.k==='bt'){setStyle('bt');}
    else setStyle(d.k,d.val);
  },
  proto:d=>{
    const p = d.p;
    if(p==='runs'||p==='new'||p==='progress'){st.view=p; return;}
    st.view='review';
    if(p==='review'){st.phase='review'; st.tab='source';}
    if(p==='results'){
      if(!openC().length){
        addC({kind:'cell',s:'sofp',row:'orecv',ci:0},'Other receivables, deposits and prepayments · 2025','The amount due from the director should be under related parties.');
        addC({kind:'cell',s:'sofp',row:'opay',ci:1},'Other payables and accruals · 2024','This does not match the page.');
        addC({kind:'note',note:'ppe',bi:1},'Property, plant and equipment · Table','Columns misaligned. Total line missing');
        addC({kind:'cell',s:'sopl',row:'adm',ci:0},'Administrative expenses · 2025','Should this include depreciation?');
      }
      st.sec='sofp'; st.tpl=null; st.note=null; st.cell=null; st.filter='all'; st.phase='working'; finish();
    }
    if(p==='reviewed'){st.phase='reviewed'; st.tab='source';}
  }
};
document.addEventListener('click',e=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  if(el.disabled) return;
  const keep = A[el.dataset.a](el.dataset, el);
  if(!keep) render();
});
document.addEventListener('input',e=>{ if(e.target.id==='cbox') st.draft = e.target.value; });
document.addEventListener('change',e=>{
  const c = e.target.dataset.c; if(!c) return;
  if(c==='field'){ NOTE[st.note].field = e.target.value; render(); return; }
  const s = st.sec, r = row(s,st.cell.row), ci = st.cell.ci;
  if(c==='value'){
    const raw = e.target.value.trim(), neg = /^\(.*\)$|^-/.test(raw), num = parseInt(raw.replace(/[^0-9]/g,''),10);
    r.v[ci] = isNaN(num) ? null : (neg?-num:num);
    st.edited.add(ck(s,r.id,ci)); if(r.flag) delete r.flag[ci];
  }
  if(c==='move'){
    const to = row(s,e.target.value); if(to.id===r.id) return;
    to.v[ci] = (to.v[ci]||0) + (r.v[ci]||0); r.v[ci] = null;
    st.edited.add(ck(s,r.id,ci)); st.edited.add(ck(s,to.id,ci)); if(r.flag) delete r.flag[ci];
    st.cell = {row:to.id,ci};
  }
  render();
});
render();
</script>
</body>
