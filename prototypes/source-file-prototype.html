<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Source file prototype</title>
<style>
/* Builds on review-prototype-v3.html, polish-prototype.html and setup-prototype.html (approved).
   Proposal: a run starts from one file, which may be a PDF, a Word document or an Excel workbook. Data is invented. */
:root{
  --bg:#EEEFF1; --panel:#FFFFFF; --tint:#F5F7F8; --line:#DFE3E6; --edge:#CBD1D6; --ink:#111111; --muted:#6B7280; --faint:#B5BCC4;
  --nav:#000000; --nav-ink:#FFFFFF; --nav-muted:#9AA1A9; --nav-on:#1F1F1F; --nav-group:#6B7280; --nav-accent:#FE7C39;
  --accent:#FD5108; --accent-text:#D64000; --accent-soft:#FFF5ED; --accent-mid:#FFE8D4;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/20px -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-width:1200px}
h1,h2,h3,p{margin:0}
h1{font-weight:500;font-size:22px;line-height:28px;letter-spacing:-.015em}
h2{font-weight:500;font-size:16px;line-height:24px;letter-spacing:-.005em}
h3{font-weight:500;font-size:14px;line-height:20px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.app{height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr)}

/* sidebar */
.nav{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;padding:16px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;margin-bottom:16px;font-weight:500}
.brand i{width:14px;height:14px;border-radius:4px;background:var(--nav-accent);display:block}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;height:32px;padding:0 12px;border-radius:8px;cursor:pointer;color:var(--nav-muted);transition:background .15s,color .15s;flex:none}
.nav a:hover{color:var(--nav-ink)}
.nav a.on{background:var(--nav-on);color:var(--nav-ink)}
.nav .grp{color:var(--nav-group);font-size:12px;padding:24px 12px 4px}
.spin{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--edge);border-top-color:var(--accent);display:inline-block;flex:none;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* main */
main{min-width:0;min-height:0;display:flex;flex-direction:column;padding:0 24px 24px}
.ph{display:flex;align-items:center;gap:12px;height:80px;flex:none}
.sp{flex:1}
.meta{color:var(--muted)}
.panel{background:var(--panel);border-radius:12px;min-height:0}
.pad{padding:24px}
.narrow{width:100%;max-width:880px;display:flex;flex-direction:column;gap:16px;overflow:auto;padding-bottom:64px}
.narrow>*{flex:none}

/* buttons */
.btn{height:36px;padding:0 16px;border-radius:999px;border:1px solid transparent;background:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .12s var(--ease),background .15s,border-color .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2B2B2B}
.btn.outline{border-color:var(--edge)}
.btn.outline:hover{background:var(--tint)}
.btn.quiet{padding:0 8px;color:var(--muted)}
.btn.quiet:hover{color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.sm{height:28px;padding:0 12px;font-size:13px}
.icon{width:28px;height:28px;border-radius:8px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s;flex:none}
.icon:hover{background:var(--bg);color:var(--ink)}
.icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* status, segments, inputs */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;font-size:13px;white-space:nowrap;color:var(--ink)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--faint);flex:none}
.pill.red{background:var(--accent-text);color:#fff;padding:0 8px;border-radius:999px;font-size:12px}
.pill.red::before,.pill:has(.spin)::before{display:none}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:4px}
.seg button{height:28px;padding:0 12px;border:0;border-radius:999px;background:none;cursor:pointer;color:var(--muted);transition:background .15s,color .15s;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink)}
.in,select.in{width:100%;height:36px;padding:0 12px;border:0;border-radius:12px;background:var(--bg);outline:none;transition:box-shadow .15s}
.in:focus{box-shadow:0 0 0 2px var(--ink)}
.switch{width:36px;height:20px;border-radius:999px;border:0;background:var(--edge);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s var(--ease)}
.switch.on{background:var(--ink)}
.switch.on::after{transform:translateX(16px)}

/* tables */
table{border-collapse:collapse;width:100%}
.tbl th{font-weight:400;color:var(--muted);text-align:left;height:36px;padding:0 12px;border-bottom:1px solid var(--line)}
.tbl td{height:48px;padding:0 12px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl.tight td{height:40px}
.r{text-align:right}

/* run layout */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px}
.work,.side{display:flex;flex-direction:column;overflow:hidden}
.wh{flex:none;height:64px;display:flex;align-items:center;gap:12px;padding:0 24px}
.wb{flex:1;min-height:0;overflow:auto;padding:0 24px 24px}
.grid{table-layout:fixed}
.grid th{position:sticky;top:0;background:#fff;font-weight:400;color:var(--muted);height:32px;padding:0 12px;z-index:1;text-align:left}
.grid th.n{text-align:right;width:132px}
.grid td{height:36px;padding:0 12px;border-bottom:1px solid var(--line);transition:background .15s}
.grid td.lab{cursor:pointer}
.grid tr.hd td{font-weight:500;font-size:13px;background:var(--tint);border-bottom:0;height:32px;border-radius:8px}
.grid tr.gap td{height:12px;border:0;padding:0}
.grid tr.tot td{font-weight:500;border-bottom-color:transparent}
.grid tr.tot td.v{box-shadow:inset 0 1px 0 var(--ink)}
.grid td.v{text-align:right;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer}
.grid tr:not(.hd):not(.gap):hover td{background:var(--tint)}
.grid tr.rsel td{background:var(--accent-soft)}
.grid td.v.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}

/* side */
.tabs{flex:none;height:64px;display:flex;align-items:center;gap:24px;padding:0 24px}
.tabs a{color:var(--muted);height:64px;display:flex;align-items:center}
.tabs a.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.sb{flex:1;min-height:0;overflow:auto;padding:16px 24px 24px;display:flex;flex-direction:column;gap:16px}
.frow{display:grid;grid-template-columns:88px 1fr;align-items:center;gap:12px;min-height:36px}
.frow>span:first-child{color:var(--muted)}
.det{display:flex;flex-direction:column;gap:12px}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.bar{display:flex;gap:8px;align-items:center}

/* the source: a page picture, a reading-copy page, or a sheet */
.pgwrap{background:var(--bg);border-radius:12px;padding:16px}
.pgh{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;padding-bottom:12px}
.copy{color:var(--muted);font-size:13px;padding-bottom:12px}
.page{background:#fff;border-radius:4px;padding:24px 20px;font:400 11.5px/17px Georgia,"Times New Roman",serif;color:#222}
.page .co{text-align:center;font-weight:700}
.page .ti{text-align:center;margin-bottom:12px}
.page table td{padding:1px 0 1px 8px}
.page table td:first-child{padding-left:0}
.page td.n{text-align:right;width:84px;font-variant-numeric:tabular-nums}
.page tr.h td{font-weight:700;padding-top:8px}
.page tr.t td.n{border-top:1px solid #222}
.page tr.hl td{background:var(--accent-mid)}
.page mark{background:none;color:inherit;box-shadow:0 0 0 1.5px var(--accent);border-radius:2px;padding:0 2px}
.page.made{font:400 12px/18px Arial,Helvetica,sans-serif}
.page.made .co,.page.made .ti{text-align:left}
.page.made tr.h td{font-weight:700}
.page .skl{height:8px;background:#E6E9EC;border-radius:4px;margin:10px 0}
.sheet{table-layout:fixed;background:#fff;border-radius:4px;font-size:12px;line-height:16px}
.sheet th{font:400 11px/16px var(--mono);color:var(--faint);height:24px;text-align:center}
.sheet th:first-child,.sheet td.rn{width:30px}
.sheet th.n{width:84px}
.sheet td{height:26px;padding:0 8px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet td.rn{font:400 11px/16px var(--mono);color:var(--faint);text-align:right;padding:0 6px 0 0}
.sheet td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.sheet tr.b td{font-weight:500}
.sheet tr.hl td{background:var(--tint)}
.sheet td.mk{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.sheet .skv{display:inline-block;width:48px;height:6px;border-radius:3px;background:#E6E9EC}

/* new run, setup */
.sec{display:flex;flex-direction:column;gap:16px}
.line{display:flex;align-items:center;gap:16px;min-height:36px}
.line>span:first-child{flex:1;min-width:0}
.line .ctl{width:200px;flex:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
.fld2{display:flex;flex-direction:column;gap:8px}
.fld2>span{color:var(--muted)}
.drop{border:1.5px dashed var(--edge);border-radius:12px;height:240px;display:grid;place-items:center;text-align:center;transition:background .15s,border-color .15s}
.drop.over{background:var(--tint);border-color:var(--ink)}
.drop div{display:flex;flex-direction:column;gap:16px;align-items:center}
.line.pick{cursor:pointer;border-radius:12px;margin:0 -12px;padding:0 12px;transition:background .15s}
.line.pick:hover{background:var(--tint)}
.line.pick.sel{background:var(--accent-soft)}
.pg{color:var(--muted);width:64px;flex:none;font-family:var(--mono);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unsure{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:8px;vertical-align:middle}
.setup{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px}
.setup .form{overflow:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:64px}
.setup .form>*{flex:none}
.setup .side{overflow:auto;display:block}
.prog{height:4px;border-radius:2px;background:var(--bg);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .4s}
.feed{display:flex;flex-direction:column;gap:12px}
.fl{display:grid;grid-template-columns:16px 1fr;gap:8px;align-items:center;color:var(--muted)}
.fl .dot{width:6px;height:6px;border-radius:50%;background:var(--edge);justify-self:center}
.fl.act{color:var(--ink)}
.fl.enter{animation:pop .35s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* prototype switcher */
.proto{position:fixed;left:12px;bottom:12px;width:208px;background:#fff;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px;z-index:30}
.proto h3{font-size:13px}
.proto .seg{background:var(--tint);padding:2px;flex-wrap:wrap;border-radius:12px}
.proto .seg button{height:26px;padding:0 10px;flex:1}
.proto .list{display:flex;flex-direction:column}
.proto .list button{height:26px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;color:var(--muted)}
.proto .list button:hover{color:var(--ink)}
.proto .list button.on{background:var(--tint);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body><div id="root"></div>
<script>
/* ---------- invented data ---------- */
const CO = 'Contoh Maju Sdn. Bhd.';
const YE = '31 December 2025';
const KIND = {
  pdf:  {word:'PDF',   type:'PDF',            file:'Contoh Maju financial statements 2025.pdf',  size:'4.2 MB',  count:'38 pages',  pages:38, pg:{sofp:13,sopl:12,soci:12,soce:14,scf:15}},
  word: {word:'Word',  type:'Word document',  file:'Contoh Maju financial statements 2025.docx', size:'1.1 MB',  count:'24 pages',  pages:24, pg:{sofp:9,sopl:8,soci:8,soce:10,scf:11}},
  excel:{word:'Excel', type:'Excel workbook', file:'Contoh Maju financial statements 2025.xlsx', size:'0.6 MB',  count:'10 sheets'}
};
const OTHER = {type:'Excel workbook', file:'Teladan Jaya accounts 2025.xlsx', size:'0.4 MB'};
const STMTS = [
  ['sofp','Financial position',['Current and non-current','Order of liquidity'],'shows current and non-current assets and liabilities with their own totals.'],
  ['sopl','Profit or loss',['By function','By nature'],'groups costs by role: cost of sales, administrative, selling and distribution.'],
  ['soci','Comprehensive income',['Net of tax','Before tax','Not printed'],'carries on from profit for the year to total comprehensive income. There are no other items, so net of tax.'],
  ['soce','Changes in equity',['Changes in equity'],'shows share capital and retained earnings for both years.'],
  ['scf','Cash flows',['Indirect','Direct'],'starts from profit before tax and adjusts it.']
];
const SHEETS = [
  {n:'Cover',why:'Cover page',rows:['Contoh Maju Sdn. Bhd.','Financial statements','Year ended 31 December 2025']},
  {n:'SOFP'},
  {n:'SOPL',rows:['Revenue','Cost of sales','Gross profit','Other income','Administrative expenses','Selling and distribution expenses','Finance costs','Profit before tax','Tax expense','Profit for the year','Total comprehensive income']},
  {n:'SOCE',rows:['At 1 January 2024','Profit for the year','At 31 December 2024','Profit for the year','Dividends','At 31 December 2025']},
  {n:'SCF',rows:['Profit before tax','Depreciation','Finance costs','Changes in working capital','Tax paid','Net cash from operating activities','Purchase of plant and equipment','Repayment of lease liabilities','Net change in cash']},
  {n:'Notes',rows:['1. Corporate information','2. Basis of preparation','3. Material accounting policies','4. Revenue','5. Other income','6. Profit before tax','7. Tax expense']},
  {n:'Note 10 PPE',rows:['Cost','At 1 January 2025','Additions','Disposals','At 31 December 2025','Accumulated depreciation','Charge for the year','Carrying amount']},
  {n:'TB 2025',why:'Working paper',rows:['1000 Cash at bank','1100 Trade debtors','1200 Stock','2000 Trade creditors','3000 Share capital','4000 Sales','5000 Purchases']},
  {n:'Adjustments',why:'Working paper',rows:['AJE 1 Depreciation','AJE 2 Accruals','AJE 3 Tax provision','AJE 4 Reclassify deposits']},
  {n:'Old SOFP',why:'Hidden sheet',rows:['Non-current assets','Current assets','Total assets','Equity','Liabilities']}
];
const NOTES = [['1','Corporate information',16,10,'Notes'],['2','Basis of preparation',16,10,'Notes'],['3','Material accounting policies',17,11,'Notes'],['4','Revenue',23,14,'Notes'],['5','Other income',23,14,'Notes'],['6','Profit before tax',23,15,'Notes'],['7','Tax expense',25,16,'Notes'],['10','Property, plant and equipment',26,17,'Note 10 PPE'],['13','Trade and other receivables',29,19,'Notes'],['14','Cash and bank balances',30,20,'Notes']];
/* The statement of financial position, as printed. On the sheet, the first line is row 5; 2025 is column B and 2024 column C. */
const ROWS = [
  {t:'head',l:'Non-current assets'},
  {l:'Property, plant and equipment',v:[1284300,1196450]},
  {l:'Right-of-use assets',v:[212600,265750]},
  {l:'Deferred tax assets',v:[18400,15200]},
  {t:'total',l:'Total non-current assets',v:[1515300,1477400]},
  {t:'head',l:'Current assets'},
  {l:'Inventories',v:[342150,318900]},
  {l:'Trade and other receivables',v:[687420,602310]},
  {l:'Cash and bank balances',v:[455880,391640]},
  {t:'total',l:'Total current assets',v:[1485450,1312850]},
  {t:'total',l:'Total assets',v:[3000750,2790250]},
  {t:'head',l:'Equity'},
  {l:'Share capital',v:[1000000,1000000]},
  {l:'Retained earnings',v:[1104270,921480]},
  {t:'total',l:'Total equity',v:[2104270,1921480]},
  {t:'head',l:'Liabilities'},
  {l:'Lease liabilities',v:[176300,228900]},
  {l:'Trade and other payables',v:[652480,581270]},
  {l:'Tax payable',v:[67700,58600]},
  {t:'total',l:'Total liabilities',v:[896480,868770]},
  {t:'total',l:'Total equity and liabilities',v:[3000750,2790250]}
];
const COLS = ['2025','2024'], FIRST_ROW = 5, LETTER = ['B','C'];
const READING = {
  pdf:  ['Reading the pages','Found the contents page on page 3','Finding the statements','Reading the notes'],
  word: ['Reading the text','Reading the tables','Making the reading copy','Finding the statements','Reading the notes'],
  excel:['Reading the sheets','Reading the tables','Making the reading copy','Finding which sheet holds each statement','Reading the notes']
};
const NEW_STATES = [['empty','Empty'],['chosen','File chosen'],['uploading','Uploading'],['two','Two files dropped'],['doc','Refused: old Word file'],['xls','Refused: old Excel file'],['locked','Refused: password'],['large','Refused: too large']];
const SCREENS = [['new','New run'],['reading','Reading'],['setup','Setup'],['review','Review']];

/* ---------- state ---------- */
const st = {kind:'pdf', screen:'new', ns:'empty', files:[], step:0, sel:null, shown:{}, otherPage:false, cell:{row:7,ci:0}, std:'MFRS', level:'Company', rw:''};
let timer = null;
function reset(){
  st.sel = null; st.shown = {}; st.otherPage = false; st.rw = '';
  st.pg = Object.assign({}, KIND[st.kind].pg || {});
  st.sheets = {sofp:['SOFP'],sopl:['SOPL'],soci:['SOPL'],soce:['SOCE'],scf:['SCF'],notes:['Notes','Note 10 PPE']};
  st.off = {};
}
const esc = s => String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmt = v => v==null ? '' : v.toLocaleString('en-US');
const X = '<svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
const opts = (list,cur) => list.map(x=>`<option${x===cur?' selected':''}>${esc(x)}</option>`).join('');
const usedSheets = () => new Set(Object.values(st.sheets).flat());
const unused = () => SHEETS.filter(s=>!usedSheets().has(s.n));

/* ---------- where a figure comes from, said the same way everywhere ---------- */
function sourceRef(){
  const c = st.cell, k = st.kind;
  if(k==='pdf') return 'Page '+KIND.pdf.pg.sofp;
  if(k==='word') return 'Reading copy, page '+KIND.word.pg.sofp;
  if(!c) return 'SOFP';
  return c.ci==null ? 'SOFP, row '+(FIRST_ROW+c.row) : 'SOFP, cell '+LETTER[c.ci]+(FIRST_ROW+c.row);
}

/* ---------- the three kinds of source ---------- */
function pageBody(made, markRow, markCi){
  return `<div class="page${made?' made':''}"><div class="co">${made?CO:CO.toUpperCase()}</div><div class="ti">Statement of financial position as at ${YE}</div><table>
    <tr><td></td>${COLS.map(c=>`<td class="n"><b>${c}</b></td>`).join('')}</tr>
    ${ROWS.map((r,i)=>r.t==='head'?`<tr class="h"><td colspan="3">${r.l}</td></tr>`:
      `<tr class="${r.t==='total'?'t':''}${markRow===i?' hl':''}"><td>${r.l}</td>${r.v.map((v,ci)=>`<td class="n">${markRow===i&&markCi===ci?`<mark>${fmt(v)}</mark>`:fmt(v)}</td>`).join('')}</tr>`).join('')}
  </table></div>`;
}
function pagePlain(title, made){
  return `<div class="page${made?' made':''}"><div class="co">${made?CO:CO.toUpperCase()}</div><div class="ti">${title}</div>${'<div class="skl"></div>'.repeat(12)}</div>`;
}
function sheetGrid(name, markRow, markCi){
  const s = SHEETS.find(x=>x.n===name);
  const head = `<thead><tr><th></th><th>A</th><th class="n">B</th><th class="n">C</th></tr></thead>`;
  if(name!=='SOFP'){
    return `<table class="sheet">${head}<tbody>${s.rows.map((l,i)=>`<tr><td class="rn">${i+1}</td><td title="${esc(l)}">${esc(l)}</td><td class="n">${s.n==='Cover'?'':'<i class="skv"></i>'}</td><td class="n">${s.n==='Cover'?'':'<i class="skv"></i>'}</td></tr>`).join('')}</tbody></table>`;
  }
  const top = `<tr class="b"><td class="rn">1</td><td colspan="3">${CO}</td></tr><tr><td class="rn">2</td><td colspan="3">Statement of financial position as at ${YE}</td></tr><tr><td class="rn">3</td><td></td><td></td><td></td></tr><tr><td class="rn">4</td><td></td><td class="n">2025</td><td class="n">2024</td></tr>`;
  const body = ROWS.map((r,i)=>`<tr class="${r.t?'b':''}${markRow===i&&markCi==null?' hl':''}"><td class="rn">${FIRST_ROW+i}</td><td title="${esc(r.l)}">${esc(r.l)}</td>${r.v?r.v.map((v,ci)=>`<td class="n${markRow===i&&markCi===ci?' mk':''}">${fmt(v)}</td>`).join(''):'<td></td><td></td>'}</tr>`).join('');
  return `<table class="sheet">${head}<tbody>${top}${body}</tbody></table>`;
}
const COPY_LINE = `<p class="copy">Reading copy made from the Word file. Page numbers differ from the printed report.</p>`;
function sourceView(){
  const c = st.cell, k = st.kind, row = c?c.row:undefined, ci = c?c.ci:undefined;
  if(k==='excel') return `<div class="pgwrap"><div class="pgh"><span>${sourceRef()}</span><span class="mono">Sheet 2 of 10</span></div>${sheetGrid('SOFP',row,ci)}</div>`;
  const p = KIND[k].pg.sofp;
  return `<div class="pgwrap"><div class="pgh"><span>Page ${p}</span><span class="mono">${p} of ${KIND[k].pages}</span></div>${k==='word'?COPY_LINE:''}${pageBody(k==='word',row,ci)}</div>`;
}

/* ---------- screens ---------- */
function sidebar(){
  const inRun = st.screen==='review';
  let h = `<div class="brand"><i></i>XBRL Agent</div><a class="${inRun?'':'on'}"><span>Runs</span></a><a><span>Settings</span></a>`;
  if(inRun) h += `<div class="grp">Statements</div><a class="on"><span>Financial position</span></a><a><span>Profit or loss</span></a><a><span>Changes in equity</span></a><a><span>Cash flows</span></a><a><span>Checks</span></a><div class="grp">Notes</div><a><span>Corporate information</span></a><a><span>Accounting policies</span></a>`;
  return `<nav class="nav">${h}</nav>`;
}
function fileLine(f, right){
  return `<div class="line"><span>${esc(f.file)}</span><span class="meta">${f.type}</span><span class="meta mono">${f.size}</span>${right}</div>`;
}
function refusal(){
  const base = 'Contoh Maju financial statements 2025';
  const text = {
    doc:`${base}.doc is in the old Word format. Save it as .docx and upload that.`,
    xls:`${base}.xls is in the old Excel format. Save it as .xlsx and upload that.`,
    locked:`${KIND[st.kind].file} is protected by a password. Remove the password and upload it again.`,
    large:`${KIND[st.kind].file} is 148 MB. The largest file a run can take is 50 MB.`
  }[st.ns];
  return text ? `<div class="panel pad sec"><div><span class="pill red">Not uploaded</span></div><p>${esc(text)}</p></div>` : '';
}
function newRun(){
  const n = st.files.length;
  let inner;
  if(st.ns==='uploading'){
    inner = `<div class="sec">${st.files.map(f=>fileLine(f,`<span class="pill"><span class="spin"></span>Uploading</span>`)).join('')}<div class="prog"><i id="up" style="width:8%"></i></div></div>`;
  } else if(n){
    inner = `<div class="sec">${st.files.map((f,i)=>fileLine(f,`<button class="icon" title="Remove" data-a="unfile" data-i="${i}">${X}</button>`)).join('')}
      <div class="bar"><span class="sp"></span><button class="btn primary" data-a="upload">${n>1?`Start ${n} runs`:'Upload'}</button></div></div>`;
  } else {
    inner = `<div class="drop" id="drop"><div><span>Drop a PDF, Word or Excel file</span><button class="btn outline" data-a="choose">Choose file</button></div></div>`;
  }
  return `<div class="ph"><h1>New run</h1></div><div class="narrow">${refusal()}<div class="panel pad">${inner}</div></div>`;
}
function runsList(){
  return `<div class="ph"><h1>Runs</h1><span class="sp"></span><button class="btn primary" data-a="go" data-s="new">New run</button></div>
  <div class="narrow"><div class="panel pad"><table class="tbl"><thead><tr><th>File</th><th>Kind</th><th>Started</th><th style="width:140px">Status</th></tr></thead><tbody>
  ${st.files.map(f=>`<tr><td>${esc(f.file)}</td><td class="meta">${f.type}</td><td class="meta">Just now</td><td><span class="pill"><span class="spin"></span>Reading</span></td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function head(ready){
  return `<div class="ph"><h1>New run</h1><span class="sp"></span><button class="btn quiet" data-a="go" data-s="new">Cancel</button><button class="btn primary" ${ready?'data-a="go" data-s="review"':'disabled'}>Start run</button></div>`;
}
function docPanel(replace){
  const d = KIND[st.kind];
  return `<div class="panel pad sec"><h2>Document</h2><div class="line"><span>${esc(d.file)}</span><span class="meta mono">${d.count}</span>${replace?'<button class="btn outline sm" data-a="go" data-s="new">Replace</button>':''}</div></div>`;
}
function reading(){
  const steps = READING[st.kind], at = Math.min(st.step, steps.length-1);
  return head(false)+`<div class="narrow">${docPanel(false)}
    <div class="panel pad sec"><div class="line"><span class="pill"><span class="spin"></span>${steps[at]}</span></div>
    <div class="prog"><i style="width:${Math.round((at+1)/(steps.length+1)*100)}%"></i></div>
    ${at?`<div class="feed">${steps.slice(0,at).map((s,i)=>`<div class="fl${i===at-1?' enter':''}"><span class="dot"></span><span>${s}</span></div>`).join('')}</div>`:''}
    </div></div>`;
}
const where = code => st.kind==='excel' ? (st.sheets[code].length ? `The sheet ${st.sheets[code][0]}` : '') : `Page ${st.pg[code]}`;
function statementSide(i){
  const [code,name,,why] = STMTS[i], k = st.kind;
  if(k==='excel'){
    const mine = st.sheets[code], cur = mine.includes(st.shown[code]) ? st.shown[code] : mine[0];
    return `<div class="panel pad sec"><div class="line"><h2>${name}</h2><span class="meta mono">${cur?esc(cur):'No sheet'}</span></div>
      ${cur?`<p>${where(code)} ${why}</p>`:''}
      ${mine.length>1?`<div><div class="seg">${mine.map(s=>`<button class="${s===cur?'on':''}" data-a="show" data-code="${code}" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`:''}
      ${cur?`<div class="pgwrap">${sheetGrid(cur)}</div>`:''}
      <div class="frow"><span>Sheet</span><select class="in" data-c="sheet" data-code="${code}">${cur?'':'<option selected>Choose a sheet</option>'}${opts(SHEETS.map(s=>s.n),cur)}</select></div></div>`;
  }
  const p = st.pg[code], pages = KIND[k].pages;
  return `<div class="panel pad sec"><div class="line"><h2>${name}</h2><span class="meta mono">Page ${p} of ${pages}</span></div>
    <p>${where(code)} ${why}</p>
    <div class="pgwrap">${k==='word'?COPY_LINE:''}${code==='sofp'?pageBody(k==='word'):pagePlain('Statement of '+name.toLowerCase(),k==='word')}</div>
    ${st.otherPage?`<div class="bar"><input class="in" id="op" style="flex:1;width:auto" placeholder="Pages, 1 to ${pages}"><button class="btn quiet" data-a="otherpage">Cancel</button><button class="btn outline" data-a="setpage" data-code="${code}">Set</button></div>`
      :`<div class="bar"><button class="btn outline sm" data-a="otherpage">Other page</button></div>`}</div>`;
}
function notesSide(){
  const k = st.kind;
  if(k==='excel'){
    const mine = st.sheets.notes, list = NOTES.filter(n=>mine.includes(n[4]));
    return `<div class="panel pad sec"><div class="line"><h2>Notes</h2><span class="meta">${list.length} notes</span></div>
      <table class="tbl tight"><tbody>${mine.map(s=>`<tr><td>${esc(s)}</td><td class="meta r">${NOTES.filter(n=>n[4]===s).length} notes</td><td style="width:36px"><button class="icon" title="Do not use ${esc(s)}" data-a="dropnotes" data-v="${esc(s)}">${X}</button></td></tr>`).join('')}</tbody></table>
      <table class="tbl tight"><thead><tr><th style="width:48px">No.</th><th>Title</th><th class="r">Sheet</th></tr></thead><tbody>${list.map(n=>`<tr><td class="mono">${n[0]}</td><td>${esc(n[1])}</td><td class="meta mono r">${esc(n[4])}</td></tr>`).join('')}</tbody></table></div>`;
  }
  return `<div class="panel pad sec"><div class="line"><h2>Notes</h2><span class="meta">${NOTES.length} notes</span></div>
    ${k==='word'?COPY_LINE.replace(' class="copy"',' class="meta"'):''}
    <table class="tbl tight"><thead><tr><th style="width:48px">No.</th><th>Title</th><th class="r">Page</th></tr></thead><tbody>${NOTES.map(n=>`<tr><td class="mono">${n[0]}</td><td>${esc(n[1])}</td><td class="meta mono r">p${k==='word'?n[3]:n[2]}</td></tr>`).join('')}</tbody></table></div>`;
}
function setup(){
  const k = st.kind, ex = k==='excel';
  const rows = STMTS.map(([code,name,lay],i)=>{
    const mine = ex ? st.sheets[code] : null, none = ex && !mine.length;
    const at = ex ? mine.join(', ') : 'p'+st.pg[code];
    return `<div class="line pick${st.sel===i?' sel':''}" data-a="pick" data-i="${i}"><span>${name}${none?'<span class="unsure" title="No sheet chosen"></span>':''}</span><span class="pg" title="${esc(at)}">${esc(at)}</span><div class="ctl"><select class="in">${opts(lay,lay[0])}</select></div><button class="switch${st.off[code]||none?'':' on'}" data-a="sw" data-code="${code}"></button></div>`;
  }).join('');
  const nn = ex ? NOTES.filter(n=>st.sheets.notes.includes(n[4])).length : NOTES.length;
  const left = unused();
  const targets = ['Not used',...STMTS.map(s=>s[1]),'Notes'];
  const spare = ex ? `<div class="panel pad sec"><h2>Sheets not used</h2>${left.length?left.map(s=>`<div class="line"><span>${esc(s.n)}</span><span class="meta">${s.why||''}</span><div class="ctl"><select class="in" data-c="bring" data-v="${esc(s.n)}">${opts(targets,'Not used')}</select></div></div>`).join(''):'<p class="meta">Every sheet is in use</p>'}</div>` : '';
  const side = st.sel==='notes' ? notesSide() : st.sel==null ? `<div class="panel pad sec"><h2>Source</h2></div>` : statementSide(st.sel);
  return head(true)+`<div class="setup"><div class="form">
    ${docPanel(true)}
    <div class="panel pad sec"><h2>Filing</h2><div class="g2">
      <label class="fld2" style="grid-column:1/3"><span>Company</span><input class="in" value="${CO}"></label>
      <label class="fld2"><span>Year end</span><input class="in" value="${YE}"></label>
      <label class="fld2"><span>Amounts in</span><select class="in"><option>RM</option><option>RM thousands</option></select></label>
      <div class="fld2"><span>Standard</span><div><div class="seg">${['MFRS','MPERS'].map(x=>`<button class="${st.std===x?'on':''}" data-a="seg" data-k="std" data-v="${x}">${x}</button>`).join('')}</div></div></div>
      <div class="fld2"><span>Level</span><div><div class="seg">${['Company','Group'].map(x=>`<button class="${st.level===x?'on':''}" data-a="seg" data-k="level" data-v="${x}">${x}</button>`).join('')}</div></div></div>
    </div></div>
    <div class="panel pad sec"><h2>Statements</h2>${rows}
      <div class="line pick${st.sel==='notes'?' sel':''}" data-a="pick" data-i="notes"><span>Notes</span>${ex?`<span class="pg" style="width:auto;max-width:200px" title="${esc(st.sheets.notes.join(', '))}">${esc(st.sheets.notes.join(', '))}</span>`:''}<span class="meta">${nn} notes</span><button class="switch${st.off.notes?'':' on'}" data-a="sw" data-code="notes"></button></div></div>
    ${spare}
    <div class="panel pad sec"><h2>Guidance for this company</h2><div class="bar"><input class="in" style="flex:1;width:auto" placeholder="Add guidance"><button class="btn outline">Add</button></div></div>
  </div><div class="side">${side}</div></div>`;
}
function review(){
  const c = st.cell;
  const body = ROWS.map((r,i)=>{
    if(r.t==='head') return (i?'<tr class="gap"><td colspan="3"></td></tr>':'')+`<tr class="hd"><td colspan="3">${r.l}</td></tr>`;
    const rs = c && c.row===i && c.ci==null;
    return `<tr class="${r.t==='total'?'tot':''}${rs?' rsel':''}"><td class="lab" data-a="rowsel" data-row="${i}">${r.l}</td>${r.v.map((v,ci)=>`<td class="v${c&&c.row===i&&c.ci===ci?' sel':''}" data-a="cell" data-row="${i}" data-ci="${ci}">${fmt(v)}</td>`).join('')}</tr>`;
  }).join('');
  let det;
  if(!c) det = `<div class="det"><div class="dh"><h3>Financial position</h3></div><div class="frow"><span>Source</span><span>${sourceRef()}</span></div></div>`;
  else {
    const r = ROWS[c.row];
    const mid = c.ci==null ? COLS.map((col,ci)=>`<div class="frow"><span>${col}</span><span class="mono">${fmt(r.v[ci])}</span></div>`).join('')
      : r.t==='total' ? `<div class="frow"><span>${COLS[c.ci]}</span><span class="mono">${fmt(r.v[c.ci])}</span></div>`
      : `<div class="frow"><span>${COLS[c.ci]}</span><input class="in mono" style="text-align:right" value="${fmt(r.v[c.ci])}"></div><div class="frow"><span>Field</span><select class="in">${opts(ROWS.filter(q=>!q.t).map(q=>q.l),r.l)}</select></div>`;
    const rw = c.ci!=null && r.t!=='total' ? `<div class="frow"><span>This figure</span><div><div class="seg"><button class="${st.rw==='right'?'on':''}" data-a="rw" data-v="right">Right</button><button class="${st.rw==='wrong'?'on':''}" data-a="rw" data-v="wrong">Wrong</button></div></div></div>` : '';
    det = `<div class="det"><div class="dh"><h3>${r.l}</h3></div>${mid}<div class="frow"><span>Source</span><span>${sourceRef()}</span></div>${rw}</div>`;
  }
  return `<div class="ph"><h1>${CO}</h1><span class="sp"></span><button class="btn quiet">Download traces</button><button class="btn primary">Prepare mTool file</button></div>
  <div class="cols"><section class="panel work"><div class="wh"><h2>Financial position</h2></div>
    <div class="wb"><table class="grid"><thead><tr><th>Line in report</th>${COLS.map(x=>`<th class="n">${x}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div></section>
  <aside class="panel side"><div class="tabs"><a>Needs you</a><a class="on">Source</a><a>Comments</a><a>Activity</a></div><div class="sb">${det}${sourceView()}</div></aside></div>`;
}

/* ---------- prototype switcher ---------- */
function proto(){
  return `<div class="proto"><h3>Prototype</h3>
    <div class="seg">${Object.keys(KIND).map(k=>`<button class="${st.kind===k?'on':''}" data-a="kind" data-k="${k}">${KIND[k].word}</button>`).join('')}</div>
    <div class="seg">${SCREENS.map(([s,l])=>`<button class="${st.screen===s?'on':''}" data-a="go" data-s="${s}">${l}</button>`).join('')}</div>
    ${st.screen==='new'?`<div class="list">${NEW_STATES.map(([s,l])=>`<button class="${st.ns===s?'on':''}" data-a="ns" data-s="${s}">${l}</button>`).join('')}</div>`:''}</div>`;
}
function render(){
  const v = {new:newRun, runs:runsList, reading, setup, review}[st.screen]();
  const sb = document.querySelector('.sb, .setup .side'), top = sb ? sb.scrollTop : 0;
  document.getElementById('root').innerHTML = `<div class="app">${sidebar()}<main>${v}</main></div>${proto()}`;
  const again = document.querySelector('.sb, .setup .side'); if(again) again.scrollTop = top;
  const up = document.getElementById('up'); if(up) requestAnimationFrame(()=>requestAnimationFrame(()=>{ up.style.transition='width 1.5s linear'; up.style.width='100%'; }));
}

/* ---------- behaviour ---------- */
function stop(){ clearTimeout(timer); timer = null; }
function setNew(ns){
  stop(); st.screen = 'new'; st.ns = ns;
  const one = Object.assign({}, KIND[st.kind]);
  st.files = ns==='chosen'||ns==='uploading' ? [one] : ns==='two' ? [Object.assign({}, KIND.pdf), OTHER] : [];
  if(ns==='uploading') timer = setTimeout(()=>go('reading'), 1800);
}
function go(screen){
  stop(); st.screen = screen;
  if(screen==='new'){ setNew('empty'); }
  if(screen==='reading'){ st.step = 0; tick(); }
  if(screen==='setup' || screen==='review'){ reset(); st.cell = {row:7,ci:0}; }
  render();
}
function tick(){
  timer = setTimeout(()=>{
    if(st.step >= READING[st.kind].length-1){ go('setup'); return; }
    st.step++; render(); tick();
  }, 1500);
}
document.addEventListener('click',e=>{
  const t = e.target.closest('[data-a]'); if(!t) return;
  const a = t.dataset.a, d = t.dataset;
  if(a==='go'){ go(d.s); return; }
  if(a==='kind'){ st.kind = d.k; if(st.screen==='new'){ setNew(st.ns==='two'?'two':st.ns); } else if(st.screen==='runs'){ go('new'); return; } else { go(st.screen); return; } }
  else if(a==='ns'){ setNew(d.s); }
  else if(a==='choose'){ setNew('chosen'); }
  else if(a==='unfile'){ st.files.splice(+d.i,1); st.ns = st.files.length ? 'chosen' : 'empty'; }
  else if(a==='upload'){
    if(st.files.length>1){ st.ns = 'uploading'; stop(); timer = setTimeout(()=>{ st.screen='runs'; render(); }, 1800); }
    else {
      const k = Object.keys(KIND).find(x=>KIND[x].file===st.files[0].file); if(k) st.kind = k;
      st.ns = 'uploading'; stop(); timer = setTimeout(()=>go('reading'), 1800);
    }
  }
  else if(a==='seg'){ st[d.k] = d.v; }
  else if(a==='sw'){ st.off[d.code] = !st.off[d.code]; e.stopPropagation(); }
  else if(a==='pick'){ if(e.target.closest('select,button')) return; const i = d.i==='notes' ? 'notes' : +d.i; st.sel = st.sel===i ? null : i; st.otherPage = false; }
  else if(a==='show'){ st.shown[d.code] = d.v; }
  else if(a==='otherpage'){ st.otherPage = !st.otherPage; }
  else if(a==='setpage'){ const n = parseInt(document.getElementById('op').value,10); if(!(n>=1 && n<=KIND[st.kind].pages)) return; st.pg[d.code] = n; st.otherPage = false; }
  else if(a==='dropnotes'){ st.sheets.notes = st.sheets.notes.filter(s=>s!==d.v); }
  else if(a==='cell'){ st.cell = {row:+d.row, ci:+d.ci}; st.rw = ''; }
  else if(a==='rowsel'){ st.cell = {row:+d.row, ci:null}; st.rw = ''; }
  else if(a==='rw'){ st.rw = d.v; }
  render();
});
document.addEventListener('change',e=>{
  const t = e.target.closest('[data-c]'); if(!t) return;
  if(t.dataset.c==='sheet'){
    if(!SHEETS.some(s=>s.n===t.value)) return;
    st.sheets[t.dataset.code] = [t.value]; delete st.shown[t.dataset.code];
  } else if(t.dataset.c==='bring'){
    const to = t.value==='Notes' ? 'notes' : (STMTS.find(s=>s[1]===t.value)||[])[0];
    if(!to) return;
    st.sheets[to] = st.sheets[to].concat(t.dataset.v);
    if(to!=='notes'){ st.sel = STMTS.findIndex(s=>s[0]===to); st.shown[to] = t.dataset.v; } else st.sel = 'notes';
  }
  render();
});
document.addEventListener('dragover',e=>{ const z = document.getElementById('drop'); if(z){ e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave',e=>{ const z = document.getElementById('drop'); if(z && !e.relatedTarget) z.classList.remove('over'); });
document.addEventListener('drop',e=>{ if(document.getElementById('drop')){ e.preventDefault(); setNew(e.dataTransfer && e.dataTransfer.files.length>1 ? 'two' : 'chosen'); render(); } });
reset(); setNew('empty'); render();
</script></body></html>
